// RunAnywhere IDL - semantic image-segmentation types.

syntax = "proto3";

package runanywhere.v1;

import "rac_options.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "SegmentationProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// Packed 8-bit pixel layouts accepted at the SDK boundary. Rows are tightly
// packed; callers must not include per-row padding.
enum SegmentationPixelFormat {
    SEGMENTATION_PIXEL_FORMAT_UNSPECIFIED = 0;
    SEGMENTATION_PIXEL_FORMAT_RGB8        = 1;
    SEGMENTATION_PIXEL_FORMAT_RGBA8       = 2;
    SEGMENTATION_PIXEL_FORMAT_BGRA8       = 3;
}

message SegmentationImage {
    bytes data = 1 [(runanywhere.v1.rac_required) = true];
    uint32 width = 2 [
        (runanywhere.v1.rac_required) = true,
        (runanywhere.v1.rac_min) = 1,
        (runanywhere.v1.rac_max) = 4096
    ];
    uint32 height = 3 [
        (runanywhere.v1.rac_required) = true,
        (runanywhere.v1.rac_min) = 1,
        (runanywhere.v1.rac_max) = 4096
    ];
    SegmentationPixelFormat pixel_format = 4 [(runanywhere.v1.rac_required) = true];
}

message SegmentationOptions {
    // When true, also return a deterministic class-colour RGBA image. The
    // canonical class_mask_u16_le remains the machine-readable result.
    bool include_diagnostic_rgba = 1;

    // When true, also return confidence_mask_u8: the model's probability for
    // the class it chose, per pixel. Costs width * height extra bytes.
    bool include_confidence = 2;
}

message SegmentationRequest {
    SegmentationImage image = 1;
    optional SegmentationOptions options = 2;

    // Registry id, catalog id, or absolute path. Unset = use the resident
    // semantic-segmentation model. Mirrors EmbeddingsRequest.model_id and
    // VLMGenerationRequest.model_id.
    optional string model_id = 3;
}

// Coverage share of a class is pixel_count / (SegmentationResult.width *
// SegmentationResult.height). Commons rejects any result whose pixel_counts
// do not sum to that product before encoding it into a SegmentationResult, so
// within this message the summaries partition the image and the division is
// exact.
message SegmentationClassSummary {
    uint32 class_id = 1;
    uint64 pixel_count = 2;
    string label = 3;
}

message SegmentationResult {
    // Both masks always describe the source image dimensions, not the model's
    // internal 512x512 input or 128x128 logits grid.
    uint32 width = 1;
    uint32 height = 2;
    bytes class_mask_u16_le = 3;
    optional bytes diagnostic_rgba = 4;
    repeated SegmentationClassSummary class_summaries = 5;
    int64 processing_time_ms = 6;
    string model_id = 7;

    // Confidence of the class in class_mask_u16_le, one byte per pixel,
    // 0..255 == probability 0.0..1.0. Same row-major order and dimensions as
    // the class mask. Present iff SegmentationOptions.include_confidence was
    // set, and then exactly width * height bytes.
    optional bytes confidence_mask_u8 = 8;
}
