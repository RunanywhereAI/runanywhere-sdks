// RunAnywhere IDL — retrieval-augmented generation.
//
// Commons resolves model ids to on-disk paths through the global model
// registry, so callers must register their embedding, LLM, and reranker models
// before configuring a session.

syntax = "proto3";

package runanywhere.v1;

import "errors.proto";
import "rac_options.proto";
import "llm_options.proto";
import "token_usage.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "RagProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

message RAGConfiguration {
    string embedding_model_id    = 1;
    string llm_model_id          = 2;
    optional int32 embedding_dimension   = 3;

    // Retrieval depth, not sampling top_k.
    optional int32 top_k                 = 4 [
        (runanywhere.v1.rac_default) = "5",
        (runanywhere.v1.rac_min) = 1
    ];

    optional float similarity_threshold  = 5 [
        (runanywhere.v1.rac_default) = "0.0",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 1.0
    ];

    // Tokens per chunk, and the overlap carried between adjacent chunks.
    optional int32 chunk_size            = 6 [
        (runanywhere.v1.rac_default) = "512",
        (runanywhere.v1.rac_min) = 1
    ];
    optional int32 chunk_overlap         = 7 [
        (runanywhere.v1.rac_default) = "64",
        (runanywhere.v1.rac_min) = 0
    ];

    optional int32 max_context_tokens    = 8;
    optional string prompt_template = 9;
    optional string embedding_config_json = 10;
    optional string llm_config_json = 11;

    // Where the vector index lives, and whether it survives the session.
    optional string index_path = 12;
    bool persist_index = 13;

    bool rerank_results = 14;
    optional string reranker_model_id = 15;
}

message RAGDocument {
    string id = 1;
    string text = 2;
    map<string, string> metadata = 4;
    optional string source_uri = 5;
    optional string adapter_handle = 6;
    optional string media_type = 7;
    int64 size_bytes = 8;
}

message RAGQueryOptions {
    reserved 2 to 6, 10;

    string question              = 1 [(runanywhere.v1.rac_required) = true];
    optional LLMGenerationOptions generation = 14;

    // Retrieval depth for this call, overriding RAGConfiguration.top_k.
    int32 retrieval_top_k        = 7;

    optional float similarity_threshold = 8;
    bool  stream                 = 9;

    // Expand the question into several queries and merge the results.
    bool  enable_multi_query     = 11;
    optional int32 multi_query_count = 12 [
        (runanywhere.v1.rac_default) = "3",
        (runanywhere.v1.rac_min) = 1,
        (runanywhere.v1.rac_max) = 8
    ];

    // Restrict retrieval to chunks whose source matches this prefix.
    optional string scope_prefix = 13;
}

// Retrieval-only request for `rac_rag_search_proto` / SDK `rag.search()`.
// Intentionally omits generation options — that is `RAGQueryOptions` /
// `rac_rag_query_proto` / SDK `rag.query()`.
message RAGSearchRequest {
    string question              = 1 [(runanywhere.v1.rac_required) = true];

    // Retrieval depth for this call, overriding RAGConfiguration.top_k.
    // Zero means "use the session default".
    int32 retrieval_top_k        = 2;

    optional float similarity_threshold = 3;

    // Expand the question into several queries and merge the results.
    // Requires a session LLM (same as RAGQueryOptions.enable_multi_query).
    bool  enable_multi_query     = 4;
    optional int32 multi_query_count = 5 [
        (runanywhere.v1.rac_default) = "3",
        (runanywhere.v1.rac_min) = 1,
        (runanywhere.v1.rac_max) = 8
    ];

    // Restrict retrieval to chunks whose source matches this prefix.
    optional string scope_prefix = 6;
}

message RAGSearchResult {
    string chunk_id              = 1;
    string text                  = 2;
    float  similarity_score      = 3;
    optional string source_document = 4;
    map<string, string> metadata = 5;
    int32 rank = 7;

    // Character offsets into the source document.
    int32 start_offset = 8;
    int32 end_offset = 9;

    int32 token_count = 10;
}

// Retrieval-only response for `rac_rag_search_proto`.
message RAGSearchResponse {
    repeated RAGSearchResult chunks = 1;
    int64  retrieval_time_ms        = 2;
    string request_id               = 3;
    optional SDKError error         = 4;
}

message RAGResult {
    string answer                = 1;
    repeated RAGSearchResult retrieved_chunks = 2;
    string context_used          = 3;
    int64  retrieval_time_ms     = 4;
    int64  generation_time_ms    = 5;
    int64  total_time_ms         = 6;

    string request_id            = 12;
    optional string thinking_content = 13;

    TokenUsage usage             = 14;
    optional SDKError error      = 15;
}

message RAGStatistics {
    int64  indexed_documents     = 1;
    int64  indexed_chunks        = 2;
    int64  total_tokens_indexed  = 3;
    int64  last_updated_ms       = 4;
    optional string index_path   = 5;
    optional string stats_json   = 6;
    int64 vector_store_size_bytes = 7;
    bool is_persistent = 8;
    int64 last_query_ms = 9;
    optional SDKError error = 12;
}

enum RAGStreamEventKind {
    RAG_STREAM_EVENT_KIND_UNSPECIFIED = 0;
    RAG_STREAM_EVENT_KIND_RETRIEVAL_STARTED = 1;
    RAG_STREAM_EVENT_KIND_CHUNK_RETRIEVED = 2;
    RAG_STREAM_EVENT_KIND_CONTEXT_READY = 3;
    RAG_STREAM_EVENT_KIND_TOKEN = 4;
    RAG_STREAM_EVENT_KIND_COMPLETED = 5;
    RAG_STREAM_EVENT_KIND_ERROR = 6;
}

message RAGStreamEvent {
    int64 timestamp_us = 2;
    string request_id = 3;
    RAGStreamEventKind kind = 4;
    optional RAGSearchResult chunk = 5;
    string token = 6;
    optional RAGResult result = 7;
    optional SDKError error = 10;
}
