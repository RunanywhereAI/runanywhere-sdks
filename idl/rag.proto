// RunAnywhere IDL — retrieval-augmented generation.
//
// Commons resolves model ids to on-disk paths through the global model
// registry, so callers must register their embedding and LLM models
// before configuring a session.

syntax = "proto3";

package runanywhere.v1;

import "errors.proto";
import "rac_options.proto";
import "llm_options.proto";
import "token_usage.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "RagProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

message RAGConfiguration {
    string embedding_model_id    = 1;
    string llm_model_id          = 2;
    optional int32 embedding_dimension   = 3;

    // Retrieval depth, not sampling top_k.
    optional int32 top_k                 = 4 [
        (runanywhere.v1.rac_default) = "5",
        (runanywhere.v1.rac_min) = 1
    ];

    // Drop hits scoring below this. 0.0 = no filtering.
    optional float score_threshold       = 5 [
        (runanywhere.v1.rac_default) = "0.0",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 1.0
    ];

    // Tokens per chunk, and the overlap carried between adjacent chunks.
    optional int32 chunk_size            = 6 [
        (runanywhere.v1.rac_default) = "512",
        (runanywhere.v1.rac_min) = 1
    ];
    optional int32 chunk_overlap         = 7 [
        (runanywhere.v1.rac_default) = "64",
        (runanywhere.v1.rac_min) = 0
    ];

    optional int32 max_context_tokens    = 8;
    optional string prompt_template = 9;
    optional string embedding_config_json = 10;

    // Pointwise rerank of the retrieved chunks using the session LLM.
    bool rerank_results = 11;
}

message RAGDocument {
    // Caller-owned stable id. Re-ingesting an existing id REPLACES its chunks.
    string id = 1;
    string text = 2;
    map<string, string> metadata = 3;

    // Where this document came from. Copied into every chunk's metadata as
    // "source" and returned as RAGSearchResult.source_document.
    optional string source_uri = 4;
}

// Remove whole documents from the index for `rac_rag_delete_proto`.
message RAGDeleteRequest {
    // RAGDocument.id values given at ingest. Empty is an error — use clear().
    repeated string document_ids = 1 [(runanywhere.v1.rac_required) = true];
}

message RAGDeleteResponse {
    int64 deleted_chunks = 1;

    // Ids that were not in the index. Not an error.
    repeated string missing_ids = 2;

    optional SDKError error = 3;
}

// The retrieval knobs, declared once. Every field unset = inherit RAGConfiguration.
message RAGRetrievalOptions {
    // Retrieval depth for this call. Unset inherits RAGConfiguration.top_k.
    optional int32 top_k = 1 [(runanywhere.v1.rac_min) = 1];

    // Drop hits scoring below this. Unset inherits RAGConfiguration.score_threshold.
    optional float score_threshold = 2 [
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 1.0
    ];

    // Expand the query into several phrasings and merge the results.
    // Requires a session LLM.
    bool enable_multi_query = 3;
    optional int32 multi_query_count = 4 [
        (runanywhere.v1.rac_default) = "3",
        (runanywhere.v1.rac_min) = 1,
        (runanywhere.v1.rac_max) = 8
    ];

    // Keep only chunks whose document id starts with this prefix.
    optional string scope_prefix = 5;
}

message RAGQueryOptions {
    string query                 = 1 [(runanywhere.v1.rac_required) = true];
    optional RAGRetrievalOptions retrieval = 2;
    optional LLMGenerationOptions generation = 3;
}

// Retrieval-only request for `rac_rag_search_proto` / SDK `rag.search()`.
// Intentionally omits generation options — that is `RAGQueryOptions` /
// `rac_rag_query_proto` / SDK `rag.query()`.
message RAGSearchRequest {
    string query                 = 1 [(runanywhere.v1.rac_required) = true];
    optional RAGRetrievalOptions retrieval = 2;
}

message RAGSearchResult {
    string chunk_id              = 1;
    string text                  = 2;

    // Relevance, higher-is-better, normalised to 0..1. Fused dense + BM25 (RRF),
    // not a raw cosine similarity.
    float  score                 = 3;

    optional string source_document = 4;
    map<string, string> metadata = 5;

    // Character offsets into the source document.
    int32 start_offset = 6;
    int32 end_offset = 7;

    int32 token_count = 8;
}

// Retrieval-only response for `rac_rag_search_proto`.
message RAGSearchResponse {
    repeated RAGSearchResult chunks = 1;
    int64  retrieval_time_ms        = 2;
    string request_id               = 3;
    optional SDKError error         = 4;
}

message RAGResult {
    string answer                = 1;
    repeated RAGSearchResult retrieved_chunks = 2;
    string context_used          = 3;

    // Measured directly, not by subtraction: embed the query + search + fuse.
    int64  retrieval_time_ms     = 4;
    int64  generation_time_ms    = 5;

    // MUST be set by rac_rag_proto_abi (event_id()).
    string request_id            = 6;
    optional string thinking_content = 7;

    // MUST be copied from the LLM result the pipeline already holds.
    TokenUsage usage             = 8;

    optional SDKError error      = 9;
}

message RAGStatistics {
    int64  indexed_documents     = 1;
    int64  indexed_chunks        = 2;
    int64  total_tokens_indexed  = 3;

    // Milliseconds since the Unix epoch when the index last changed.
    int64  last_updated_ms       = 4;

    // Bytes the index occupies (industry: VectorStore.usage_bytes).
    // MUST be populated by make_stats() — it is surfaced as RagStats.indexSizeBytes.
    int64  vector_store_size_bytes = 5;

    optional SDKError error       = 6;
}

enum RAGStreamEventKind {
    RAG_STREAM_EVENT_KIND_UNSPECIFIED = 0;
    RAG_STREAM_EVENT_KIND_TOKEN = 1;
    RAG_STREAM_EVENT_KIND_COMPLETED = 2;
    RAG_STREAM_EVENT_KIND_ERROR = 3;
}

message RAGStreamEvent {
    // Microseconds since the Unix epoch, matching every other modality.
    int64 timestamp_us = 1;
    string request_id = 2;
    RAGStreamEventKind kind = 3;
    string token = 4;
    optional RAGResult result = 5;
    optional SDKError error = 6;
}
