// RunAnywhere IDL — shared token accounting.

syntax = "proto3";

package runanywhere.v1;

option cc_enable_arenas      = true;
option java_multiple_files   = true;
option java_package          = "ai.runanywhere.proto.v1";
option java_outer_classname  = "TokenUsageProto";
option objc_class_prefix     = "RAV1";
option csharp_namespace      = "Runanywhere.V1";
option swift_prefix          = "RA";
option go_package            = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// One token-accounting shape embedded by every result and metrics message,
// replacing the input/output/total/throughput quadruple that was copied inline
// across LLM, VLM, and RAG results. Names follow the OpenAI Responses API.
message TokenUsage {
    int32  input_tokens      = 1;
    int32  output_tokens     = 2;
    int32  total_tokens      = 3;
    double tokens_per_second = 4;
}
