// RunAnywhere IDL — diffusion (image generation) types.
//
// No diffusion engine ships under engines/ yet, so nothing produces these
// messages at runtime. report_intermediate_images and the DiffusionProgress
// intermediate-image fields reach the C struct and stop there.

syntax = "proto3";

package runanywhere.v1;

import "errors.proto";
import "model_types.proto";
import "rac_options.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "DiffusionOptionsProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

enum DiffusionMode {
    DIFFUSION_MODE_UNSPECIFIED    = 0;
    DIFFUSION_MODE_TEXT_TO_IMAGE  = 1;
    DIFFUSION_MODE_IMAGE_TO_IMAGE = 2;
    DIFFUSION_MODE_INPAINTING     = 3;
}

// DDPM and LCM are forward-looking; no SDK exposes them.
enum DiffusionScheduler {
    DIFFUSION_SCHEDULER_UNSPECIFIED      = 0;
    DIFFUSION_SCHEDULER_DPMPP_2M         = 1;
    DIFFUSION_SCHEDULER_DPMPP_2M_KARRAS  = 2;   // recommended default
    DIFFUSION_SCHEDULER_DDIM             = 3;
    DIFFUSION_SCHEDULER_DDPM             = 4;
    DIFFUSION_SCHEDULER_EULER            = 5;
    DIFFUSION_SCHEDULER_EULER_A          = 6;   // Euler Ancestral
    DIFFUSION_SCHEDULER_PNDM             = 7;
    DIFFUSION_SCHEDULER_LMS              = 8;
    DIFFUSION_SCHEDULER_LCM              = 9;
    DIFFUSION_SCHEDULER_DPMPP_2M_SDE     = 10;
}

enum DiffusionModelVariant {
    DIFFUSION_MODEL_VARIANT_UNSPECIFIED = 0;
    DIFFUSION_MODEL_VARIANT_SD_1_5      = 1;
    DIFFUSION_MODEL_VARIANT_SD_2_1      = 2;
    DIFFUSION_MODEL_VARIANT_SDXL        = 3;
    DIFFUSION_MODEL_VARIANT_SDXL_TURBO  = 4;
    DIFFUSION_MODEL_VARIANT_SDXS        = 5;
    DIFFUSION_MODEL_VARIANT_LCM         = 6;   // Latent Consistency Model
}

enum DiffusionTokenizerSourceKind {
    DIFFUSION_TOKENIZER_SOURCE_KIND_UNSPECIFIED   = 0;
    DIFFUSION_TOKENIZER_SOURCE_KIND_BUNDLED_SD15  = 1;   // CLIP ViT-L/14
    DIFFUSION_TOKENIZER_SOURCE_KIND_BUNDLED_SD2   = 2;   // OpenCLIP ViT-H/14
    DIFFUSION_TOKENIZER_SOURCE_KIND_BUNDLED_SDXL  = 3;   // dual tokenizers
    DIFFUSION_TOKENIZER_SOURCE_KIND_CUSTOM        = 4;
}

message DiffusionTokenizerSource {
    DiffusionTokenizerSourceKind kind        = 1;
    optional string              custom_path = 2;
    bool                         auto_download = 3;
}

message DiffusionConfiguration {
    DiffusionModelVariant    model_variant         = 1;
    DiffusionTokenizerSource tokenizer_source      = 2;
    bool                     enable_safety_checker = 3;
    int32                    max_memory_mb         = 4;
    optional string          model_id              = 5;
    optional InferenceFramework preferred_framework = 6;
}

message DiffusionGenerationOptions {
    string             prompt              = 1 [(runanywhere.v1.rac_required) = true];
    string             negative_prompt     = 2;

    // 0 = backend default, for width, height, steps, and guidance_scale.
    int32              width               = 3 [(runanywhere.v1.rac_default) = "0"];
    int32              height              = 4 [(runanywhere.v1.rac_default) = "0"];
    int32              steps               = 5 [
        (runanywhere.v1.rac_default) = "0",
        (runanywhere.v1.rac_min) = 0,
        (runanywhere.v1.rac_max) = 50
    ];
    float              guidance_scale      = 6 [
        (runanywhere.v1.rac_default) = "0.0",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 20.0
    ];

    // -1 = random.
    int64              seed                = 7 [(runanywhere.v1.rac_default) = "-1"];

    DiffusionScheduler scheduler           = 8;
    DiffusionMode      mode                = 9;

    // For IMAGE_TO_IMAGE and INPAINTING.
    optional bytes     input_image         = 10;
    optional bytes     mask_image          = 11;
    float              denoise_strength    = 12 [
        (runanywhere.v1.rac_default) = "0.75",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 1.0
    ];

    bool               report_intermediate_images = 13;
    int32              progress_stride     = 14;
    int32              input_image_width   = 15;
    int32              input_image_height  = 16;
    optional string     input_image_media_type = 17;
    optional string     mask_image_media_type  = 18;

    // 0 = one image.
    int32               batch_size             = 19;

    bool                return_latents         = 20;
}

message DiffusionGenerationRequest {
    string request_id = 1;
    optional DiffusionGenerationOptions options = 2;
    optional string model_id = 3;
    map<string, string> metadata = 4;
}

message DiffusionProgress {
    float  progress_percent         = 1;
    int32  current_step             = 2;
    int32  total_steps              = 3;
    string stage                    = 4;
    optional bytes intermediate_image_data = 5;
    int32  intermediate_image_width        = 6;
    int32  intermediate_image_height       = 7;
    int64  timestamp_ms                    = 8;
    int64  eta_ms                          = 9;
    optional string intermediate_image_media_type = 10;
}

message DiffusionResult {
    bytes              image_data      = 1;
    int32              width           = 2;
    int32              height          = 3;

    // The resolved seed, so a run can be reproduced when seed was -1.
    int64              seed_used       = 4;

    int64              total_time_ms   = 5;
    bool               safety_flag     = 6;
    DiffusionScheduler used_scheduler  = 7;
    optional string     image_media_type = 10;
    repeated bytes      batch_images     = 11;
    int32               images_generated = 12;
    optional SDKError   error            = 13;
}

enum DiffusionStreamEventKind {
    DIFFUSION_STREAM_EVENT_KIND_UNSPECIFIED = 0;
    DIFFUSION_STREAM_EVENT_KIND_STARTED = 1;
    DIFFUSION_STREAM_EVENT_KIND_PROGRESS = 2;
    DIFFUSION_STREAM_EVENT_KIND_INTERMEDIATE_IMAGE = 3;
    DIFFUSION_STREAM_EVENT_KIND_COMPLETED = 4;
    DIFFUSION_STREAM_EVENT_KIND_ERROR = 5;
}

message DiffusionStreamEvent {
    int64 timestamp_us = 2;
    string request_id = 3;
    DiffusionStreamEventKind kind = 4;
    optional DiffusionProgress progress = 5;
    optional DiffusionResult result = 6;
    optional SDKError error = 9;
}
