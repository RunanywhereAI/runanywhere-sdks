// RunAnywhere IDL — diffusion (image generation) types.
//
// No diffusion engine ships under engines/ yet, so nothing produces these
// messages at runtime. DiffusionProgress.intermediate_image_data reaches the
// C struct and stops there — no engine emits previews.

syntax = "proto3";

package runanywhere.v1;

import "errors.proto";
import "rac_options.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "DiffusionOptionsProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// Only values with a C carrier are listed. UNSPECIFIED = the model's
// configured scheduler, which is what every engine does.
enum DiffusionScheduler {
    DIFFUSION_SCHEDULER_UNSPECIFIED      = 0;
    DIFFUSION_SCHEDULER_DPMPP_2M         = 1;
    DIFFUSION_SCHEDULER_DPMPP_2M_KARRAS  = 2;   // recommended default
    DIFFUSION_SCHEDULER_DDIM             = 3;
    DIFFUSION_SCHEDULER_EULER            = 4;
    DIFFUSION_SCHEDULER_EULER_A          = 5;   // Euler Ancestral
    DIFFUSION_SCHEDULER_PNDM             = 6;
    DIFFUSION_SCHEDULER_LMS              = 7;
    DIFFUSION_SCHEDULER_DPMPP_2M_SDE     = 8;
}

// Encoding of the returned image bytes.
enum DiffusionOutputFormat {
    DIFFUSION_OUTPUT_FORMAT_UNSPECIFIED = 0;   // = PNG
    DIFFUSION_OUTPUT_FORMAT_PNG         = 1;
    // No JPEG or WEBP encoder exists in this tree yet. Requesting one is
    // rejected outright; it is never silently answered with PNG.
    DIFFUSION_OUTPUT_FORMAT_JPEG        = 2;
    DIFFUSION_OUTPUT_FORMAT_WEBP        = 3;
    // Escape hatch: no encode, 4 bytes per pixel, "image/raw-rgba".
    DIFFUSION_OUTPUT_FORMAT_RAW_RGBA    = 4;
}

message DiffusionGenerationOptions {
    string             prompt              = 1 [(runanywhere.v1.rac_required) = true];
    string             negative_prompt     = 2;

    // 0 = backend default, for width, height, steps, and guidance_scale.
    int32              width               = 3 [(runanywhere.v1.rac_default) = "0"];
    int32              height              = 4 [(runanywhere.v1.rac_default) = "0"];
    int32              steps               = 5 [
        (runanywhere.v1.rac_default) = "0",
        (runanywhere.v1.rac_min) = 0,
        (runanywhere.v1.rac_max) = 50
    ];
    float              guidance_scale      = 6 [
        (runanywhere.v1.rac_default) = "0.0",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 20.0
    ];

    // Absent = pick a fresh random seed. Any present value is literal,
    // including 0. The seed actually used comes back on each result image.
    optional int64     seed                = 7;

    DiffusionScheduler scheduler           = 8;

    // Mode is inferred, never declared: no image = text-to-image, image =
    // image-to-image, image + mask_image = inpainting. The only invalid
    // combination is a mask with no image.

    // Source picture. Its presence promotes the request to image-to-image;
    // adding `mask_image` promotes it to inpainting. Must be an encoded
    // PNG or JPEG container.
    optional bytes     image               = 9;
    // White = repaint. Same dimensions as `image`.
    optional bytes     mask_image          = 10;
    // How far from the source image to travel. Only meaningful with `image`.
    // Effective steps = ceil(steps * strength), so a low value is
    // proportionally cheaper -- on device that is battery.
    float              strength            = 11 [
        (runanywhere.v1.rac_default) = "0.75",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 1.0
    ];

    // Container of the bytes above, as supplied by the caller. Request-side;
    // the result carries its own media type per image.
    optional string    image_media_type      = 12;
    optional string    mask_image_media_type = 13;

    // How many images to generate for this prompt. Absent = 1.
    optional int32     n                   = 14 [
        (runanywhere.v1.rac_default) = "1",
        (runanywhere.v1.rac_min) = 1,
        (runanywhere.v1.rac_max) = 8
    ];

    // Encoding of the returned image bytes.
    DiffusionOutputFormat output_format    = 15 [
        (runanywhere.v1.rac_default) = "DIFFUSION_OUTPUT_FORMAT_PNG"
    ];
}

message DiffusionGenerationRequest {
    optional DiffusionGenerationOptions options = 1;
    optional string model_id = 2;
}

message DiffusionProgress {
    int32  current_step            = 1;
    int32  total_steps             = 2;   // as resolved by the backend
    optional bytes intermediate_image_data = 3;
}

// One generated image. Per-image, because with n > 1 each image has its
// own seed and its own safety verdict (Stability `seeds`/`finish_reasons`,
// Diffusers `nsfw_content_detected`).
message DiffusionImage {
    bytes  data        = 1;
    int32  width       = 2;   // resolved, echoed back
    int32  height      = 3;
    int64  seed_used   = 4;   // so "make more like that one" works
    bool   safety_flag = 5;   // advisory, in-band, never an error
    string media_type  = 6;   // resolved output_format, e.g. "image/png"
}

message DiffusionResult {
    // One entry per requested image, in request order. commons emits exactly
    // one entry until the C ABI grows a list: rac_diffusion_result_t is a
    // single-image struct with one image_data/image_size pair.
    repeated DiffusionImage images        = 1;

    int64                   total_time_ms = 2;

    // Failures travel out-of-band on the unary path (rac_proto_buffer_t
    // status/error_message) and in DiffusionStreamEvent.error when streaming.
}

enum DiffusionStreamEventKind {
    DIFFUSION_STREAM_EVENT_KIND_UNSPECIFIED = 0;
    DIFFUSION_STREAM_EVENT_KIND_STARTED = 1;
    DIFFUSION_STREAM_EVENT_KIND_PROGRESS = 2;
    DIFFUSION_STREAM_EVENT_KIND_INTERMEDIATE_IMAGE = 3;
    DIFFUSION_STREAM_EVENT_KIND_COMPLETED = 4;
    DIFFUSION_STREAM_EVENT_KIND_ERROR = 5;
}

message DiffusionStreamEvent {
    // Generation is single-flight, so the stream itself is the correlation.
    int64 timestamp_us = 1;
    DiffusionStreamEventKind kind = 2;
    optional DiffusionProgress progress = 3;
    optional DiffusionResult result = 4;
    optional SDKError error = 5;
}
