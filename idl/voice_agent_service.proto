// RunAnywhere IDL — voice agent composition and turn handling.
//
// Commons owns the STT to LLM to TTS orchestration; platform adapters own mic
// capture, playback, and audio-session ownership.

syntax = "proto3";

package runanywhere.v1;

import "model_types.proto";
import "voice_events.proto";
import "tts_options.proto";
import "vad_options.proto";
import "llm_options.proto";

option cc_enable_arenas      = true;
option java_multiple_files   = true;
option java_package          = "ai.runanywhere.proto.v1";
option java_outer_classname  = "VoiceAgentServiceProto";
option objc_class_prefix     = "RAV1";
option csharp_namespace      = "Runanywhere.V1";
option swift_prefix          = "RA";
option go_package            = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

message VoiceAgentResult {
    bool speech_detected = 1;
    optional string transcription = 2;
    optional string assistant_response = 3;
    optional string thinking_content = 4;
    optional bytes synthesized_audio = 5;
    optional VoiceAgentComponentStates final_state = 6;
}

// Turn detection. Field names, units and semantics follow OpenAI Realtime
// `session.audio.input.turn_detection`.
message TurnDetection {
    enum Type {
        TURN_DETECTION_TYPE_UNSPECIFIED = 0;  // treated as VAD
        TURN_DETECTION_TYPE_VAD         = 1;  // the VAD decides end-of-turn
        TURN_DETECTION_TYPE_MANUAL      = 2;  // push-to-talk: app closes the turn
    }
    Type  type                 = 1;

    // Activation threshold, 0..1 — the same normalized scale as
    // VADConfiguration.activation_threshold, and the value that wins on the
    // voice-agent path when both are set. Raise it for noisy rooms.
    // 0 means unset; commons applies 0.5.
    float threshold            = 2;

    // Silence after speech before the turn is closed.
    // 0 means unset; commons applies 500.
    int32 silence_duration_ms  = 3;

    // Audio retained before speech onset so the first word is not clipped.
    // 0 means unset; commons applies 300.
    int32 prefix_padding_ms    = 4;

    // Unset means true. False makes the agent finish its sentence
    // (kiosk, scripted disclosure).
    optional bool interrupt_response = 5;

    // Unset means true. False means the app drives replies itself via say().
    optional bool create_response    = 6;
}

// One-shot turn: audio in, transcription plus response plus audio out.
//
// audio_data must be PCM signed 16-bit little-endian, mono, 16 kHz. Commons
// rejects any other encoding, but it does NOT check or resample the sample
// rate or the channel count — feeding anything else yields a wrong transcript
// rather than an error.
message VoiceAgentTurnRequest {
    string request_id = 1;
    string session_id = 2;
    bytes audio_data = 3;

    // BCP-47 STT language for this turn only. Overrides
    // VoiceAgentComposeConfig.language. Unset means the session language, or
    // model auto-detection when that is unset too.
    optional string language = 4;

    map<string, string> metadata = 5;
}

// Streamed capture frame. Same fixed input contract as VoiceAgentTurnRequest.
message VoiceAgentAudioFrame {
    bytes audio_data = 1;
    int32 sample_rate_hz = 2;
    int32 channels = 3;

    // Commons accepts AUDIO_ENCODING_UNSPECIFIED and AUDIO_ENCODING_PCM_S16_LE
    // and rejects every other value.
    AudioEncoding encoding = 4;
    bool is_final = 5;
}

// Each component takes a path or an id; commons resolves the id through the
// model registry.
message VoiceAgentComposeConfig {
    // Normal choice is the id (resolved via the model registry); path is the
    // escape hatch for an artifact you staged yourself.
    optional string stt_model_path = 1;
    optional string stt_model_id   = 2;
    optional string llm_model_path = 3;
    optional string llm_model_id   = 4;
    optional string tts_voice_path = 5;
    optional string tts_voice_id   = 6;

    optional VADConfiguration vad_config = 7;
    // NOT HONORED YET either: make_voice_llm_options() builds the turn options
    // from compile-time constants and takes no argument, so none of these
    // reach the LLM. The note on `instructions` below says
    // llm_generation.system_prompt is ignored here, which is true, but so is
    // the rest of the message.
    optional LLMGenerationOptions llm_generation = 8;

    // Intended as the system prompt for the agent: persona AND spoken delivery
    // ("talk quickly", "sound warm"), not just content. Same name and role as
    // OpenAI Realtime `session.instructions`.
    //
    // NOT HONORED YET. config_from_proto (voice_agent_internal_helpers.cpp)
    // translates this message into rac_voice_agent_config_t and never reads
    // this field, and nothing else reads it either. Every turn gets the
    // compile-time kVoiceAgentSystemPrompt that make_voice_llm_options()
    // hardcodes, so the commons voice default is not merely what you get when
    // this is unset, it is what you get regardless. Honoring it needs a slot
    // on rac_voice_agent_llm_config_t, which has none today.
    optional string instructions = 9;

    optional TurnDetection turn_detection = 10;

    // BCP-47 STT language for the whole session. One spelling across this
    // domain and stt_options.proto. Unset means the model auto-detects.
    // Per-turn override: VoiceAgentTurnRequest.language.
    optional string language = 11;
}

message VoiceAgentTranscribeProtoRequest {
    bytes  audio_data = 1;
    string session_id = 2;

    // BCP-47. Empty means auto-detect.
    string language   = 3;
}

message VoiceAgentSynthesizeSpeechProtoRequest {
    string     text       = 1;
    string     session_id = 2;
    optional TTSOptions options = 3;
}
