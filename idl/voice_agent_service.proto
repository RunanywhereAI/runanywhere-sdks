// RunAnywhere IDL — voice agent composition and turn handling.
//
// Commons owns the STT to LLM to TTS orchestration; platform adapters own mic
// capture, playback, and audio-session ownership.

syntax = "proto3";

package runanywhere.v1;

import "component_types.proto";
import "errors.proto";
import "model_types.proto";
import "voice_events.proto";
import "tts_options.proto";
import "vad_options.proto";
import "llm_options.proto";

option cc_enable_arenas      = true;
option java_multiple_files   = true;
option java_package          = "ai.runanywhere.proto.v1";
option java_outer_classname  = "VoiceAgentServiceProto";
option objc_class_prefix     = "RAV1";
option csharp_namespace      = "Runanywhere.V1";
option swift_prefix          = "RA";
option go_package            = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// Subscription parameters for the agent's event stream.
message VoiceAgentRequest {
    string event_filter = 1;
    string session_id = 2;
    repeated EventCategory categories = 3;
    ErrorSeverity min_severity = 4;
    uint64 replay_from_seq = 5;
    bool include_audio = 6;
}

message VoiceAgentResult {
    bool speech_detected = 1;
    optional string transcription = 2;
    optional string assistant_response = 3;
    optional string thinking_content = 4;
    optional bytes synthesized_audio = 5;
    optional VoiceAgentComponentStates final_state = 6;

    // Required to interpret synthesized_audio.
    int32 synthesized_audio_sample_rate_hz = 7;
    int32 synthesized_audio_channels       = 8;
    AudioEncoding synthesized_audio_encoding = 9;

    string session_id = 10;
    string turn_id = 11;

    // Per-stage timings, then the wall-clock total.
    int64 stt_time_ms = 12;
    int64 llm_time_ms = 13;
    int64 tts_time_ms = 14;
    int64 total_time_ms = 15;

    optional string error_message = 16;
    int32 error_code = 17;
}

// One-shot turn: audio in, transcription plus response plus audio out.
message VoiceAgentTurnRequest {
    string request_id = 1;
    string session_id = 2;
    bytes audio_data = 3;
    int32 sample_rate_hz = 4;
    int32 channels = 5;
    AudioEncoding encoding = 6;
    optional VoiceSessionConfig session_config = 7;
    map<string, string> metadata = 8;
}

message VoiceAgentAudioFrame {
    bytes audio_data = 1;
    int32 sample_rate = 2;
    int32 channels = 3;
    AudioEncoding encoding = 4;
    bool is_final = 5;
}

// Commons reads silence_duration_ms and max_tokens. The remaining fields are
// declared but not consumed by the C++ voice agent.
message VoiceSessionConfig {
    int32 silence_duration_ms = 1;
    float speech_threshold = 2;
    bool  auto_play_tts = 3;
    bool  continuous_mode = 4;
    bool  thinking_mode_enabled = 5;
    int32 max_tokens = 6;
    int32 max_recording_duration_ms = 7;
    optional string language_code = 8;
    optional string voice_id = 9;
}

message AudioPipelineConfig {
    int32 cooldown_duration_ms = 1;
    bool  strict_transitions   = 2;
    int32 max_tts_duration_ms  = 3;
}

// Each component takes a path, an id, or a name; commons resolves whichever is
// present through the model registry.
message VoiceAgentComposeConfig {
    optional string stt_model_path = 1;
    optional string stt_model_id   = 2;
    optional string stt_model_name = 3;
    optional string llm_model_path = 4;
    optional string llm_model_id   = 5;
    optional string llm_model_name = 6;
    optional string tts_voice_path = 7;
    optional string tts_voice_id   = 8;
    optional string tts_voice_name = 9;
    optional VADConfiguration vad_config = 24;
    optional LLMGenerationOptions llm_generation = 25;
    optional VoiceSessionConfig session_config = 20;
    optional AudioPipelineConfig audio_pipeline_config = 21;
    optional string session_id = 22;
    optional string default_language_code = 23;
}

message VoiceAgentTranscribeProtoRequest {
    bytes  audio_data    = 1;
    string session_id    = 2;
    int32  sample_rate   = 3;
    string language_hint = 4;
    int32  channels      = 5;
    AudioEncoding encoding = 6;
}

message VoiceAgentSynthesizeSpeechProtoRequest {
    string     text       = 1;
    string     session_id = 2;
    optional TTSOptions options = 3;
}
