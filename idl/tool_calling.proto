// RunAnywhere IDL — tool calling: definitions, calls, results, and parsing.
//
// Host tool registration, permission checks, execution, and side effects stay
// adapter-owned. This file covers the portable parsing, prompt formatting, and
// validation semantics.

syntax = "proto3";

package runanywhere.v1;

import "rac_options.proto";

option cc_enable_arenas      = true;
option java_multiple_files   = true;
option java_package          = "ai.runanywhere.proto.v1";
option java_outer_classname  = "ToolCallingProto";
option objc_class_prefix     = "RAV1";
option csharp_namespace      = "Runanywhere.V1";
option swift_prefix          = "RA";
option go_package            = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// A JSON value, typed rather than stringly.
message ToolValue {
    oneof kind {
        string  string_value = 1;
        double  number_value = 2;
        bool    bool_value   = 3;
        ToolValueArray  array_value  = 4;
        ToolValueObject object_value = 5;
        bool    null_value   = 6;  // true means JSON null
    }
}

message ToolValueArray {
    repeated ToolValue values = 1;
}

message ToolValueObject {
    map<string, ToolValue> fields = 1;
}

message ToolValueJSON {
    string json = 1;
}

enum ToolParameterType {
    TOOL_PARAMETER_TYPE_UNSPECIFIED = 0;
    TOOL_PARAMETER_TYPE_STRING      = 1;
    TOOL_PARAMETER_TYPE_NUMBER      = 2;
    TOOL_PARAMETER_TYPE_BOOLEAN     = 3;
    TOOL_PARAMETER_TYPE_OBJECT      = 4;
    TOOL_PARAMETER_TYPE_ARRAY       = 5;
}

// LFM2 names a model family in a wire enum, which the rest of the IDL avoids.
enum ToolCallFormatName {
    TOOL_CALL_FORMAT_NAME_UNSPECIFIED      = 0;
    TOOL_CALL_FORMAT_NAME_JSON             = 1;
    TOOL_CALL_FORMAT_NAME_LFM2             = 7;
}

enum ToolChoiceMode {
    TOOL_CHOICE_MODE_UNSPECIFIED = 0;
    TOOL_CHOICE_MODE_AUTO        = 1;
    TOOL_CHOICE_MODE_NONE        = 2;
    TOOL_CHOICE_MODE_REQUIRED    = 3;
    TOOL_CHOICE_MODE_SPECIFIC    = 4;
}

message ToolParameter {
    string name                      = 1;
    ToolParameterType type           = 2;
    string description               = 3;
    bool   required                  = 4;
    repeated string enum_values      = 5;

    // Escape hatch for parameters the typed shape cannot express.
    optional string json_schema      = 6;

    optional ToolValue default_value  = 7;
}

message ToolDefinition {
    string name                      = 1;
    string description               = 2;

    // Use parameters for the typed form, or json_schema for a raw one.
    repeated ToolParameter parameters = 3;
    optional string json_schema      = 5;

    optional string category         = 4;
    map<string, string> metadata     = 6;
}

message ToolCall {
    string id                        = 1;
    string name                      = 2;
    string arguments_json            = 3;

    // "function" is the only value today. Empty = unset.
    string type                      = 4;

    int64 created_at_ms              = 7;

    // The model text this call was parsed out of.
    optional string raw_text         = 8;
}

message ToolResult {
    string tool_call_id              = 1;
    string name                      = 2;
    string result_json               = 3;
    optional string error            = 4;

    // When false and error is empty, fall back to result_json semantics.
    bool success                     = 5;

    int64 started_at_ms              = 8;
    int64 completed_at_ms            = 9;
}

message ToolCallingOptions {
    // Empty means the SDK falls back to its registered tools.
    repeated ToolDefinition tools    = 1;

    // Run tools automatically rather than handing calls back to the caller.
    optional bool auto_execute       = 3 [(runanywhere.v1.rac_default) = "true"];

    bool   replace_system_prompt     = 7;

    // Keep offering tools after the first call resolves.
    bool   keep_tools_available      = 8;

    optional ToolCallFormatName format = 10;

    // Iteration cap on the run loop.
    optional int32 max_tool_calls = 12 [
        (runanywhere.v1.rac_default) = "5",
        (runanywhere.v1.rac_min) = 1
    ];

    // forced_tool_name applies when tool_choice is SPECIFIC.
    ToolChoiceMode tool_choice = 13;
    optional string forced_tool_name = 14;

    bool require_json_arguments = 16;
}

message ToolCallingResult {
    string text                      = 1;
    repeated ToolCall tool_calls     = 2;
    repeated ToolResult tool_results = 3;

    // False when the loop stopped at max_tool_calls with calls outstanding.
    bool   is_complete               = 4;

    optional string conversation_id  = 5;
    int32  iterations_used           = 6;
    optional string error_message    = 7;
    int32 error_code                 = 8;
    string raw_text                  = 9;
    optional string thinking_content = 10;
}

message ToolParseRequest {
    string text = 1;
    optional ToolCallingOptions options = 2;
}

message ToolParseResult {
    bool has_tool_call = 1;
    repeated ToolCall tool_calls = 2;

    // Model text left over after the calls were extracted.
    string remaining_text = 3;

    optional string error_message = 4;
    int32 error_code = 5;
}

message ToolPromptFormatRequest {
    string user_prompt = 1;
    optional ToolCallingOptions options = 2;

    // Prior turn's results and text, for multi-iteration loops.
    repeated ToolResult tool_results = 3;
    optional string assistant_text = 4;
}

message ToolPromptFormatResult {
    string formatted_prompt = 1;
    ToolCallFormatName format = 2;
    optional string error_message = 4;
    int32 error_code = 5;
}

message ToolCallValidationRequest {
    ToolCall tool_call = 1;
    optional ToolCallingOptions options = 2;
}

message ToolCallValidationResult {
    bool is_valid = 1;
    repeated string validation_errors = 2;
    optional ToolDefinition matched_tool = 3;

    // Arguments coerced to the matched tool's parameter types.
    string normalized_arguments_json = 4;

    optional string error_message = 5;
    int32 error_code = 6;
}
