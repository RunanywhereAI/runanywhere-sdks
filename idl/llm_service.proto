// RunAnywhere IDL — LLM request envelopes and streaming events.

syntax = "proto3";

package runanywhere.v1;

import "errors.proto";
import "voice_events.proto";
import "tool_calling.proto";
import "llm_options.proto";
import "token_usage.proto";
import "chat.proto";

option cc_enable_arenas      = true;
option java_multiple_files   = true;
option java_package          = "ai.runanywhere.proto.v1";
option java_outer_classname  = "LLMServiceProto";
option objc_class_prefix     = "RAV1";
option csharp_namespace      = "Runanywhere.V1";
option swift_prefix          = "RA";
option go_package            = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// The single request envelope for both unary and streaming generation.
message LLMGenerateRequest {
    string prompt           = 1;
    string request_id = 14;
    string model_id = 15;
    string conversation_id = 16;
    map<string, string> metadata = 25;
    optional LLMGenerationOptions options = 26;

    // Prior turns, excluding `prompt` (the live user turn) and
    // options.system_prompt.
    repeated ChatMessage history = 27;
}

message LLMStreamFinalResult {
    string text = 1;
    optional string thinking_content = 2;
    int64 total_time_ms = 6;
    int64 time_to_first_token_ms = 7;
    string finish_reason = 9;
    int64 prompt_eval_time_ms = 12;
    int64 decode_time_ms = 13;
    repeated ToolCall tool_calls = 14;
    repeated ToolResult tool_results = 15;

    TokenUsage usage = 16;
    optional SDKError error = 17;
}

enum LLMStreamEventKind {
    LLM_STREAM_EVENT_KIND_UNSPECIFIED = 0;
    LLM_STREAM_EVENT_KIND_STARTED = 1;
    LLM_STREAM_EVENT_KIND_TOKEN = 2;
    LLM_STREAM_EVENT_KIND_THINKING = 3;
    LLM_STREAM_EVENT_KIND_TOOL_CALL = 4;
    LLM_STREAM_EVENT_KIND_PROGRESS = 5;
    LLM_STREAM_EVENT_KIND_COMPLETED = 6;
    LLM_STREAM_EVENT_KIND_ERROR = 7;
}

// `result` is populated only on the terminal event.
message LLMStreamEvent {
    int64  timestamp_us    = 2;
    string token           = 3;
    bool   is_final        = 4;
    TokenKind kind         = 5;
    uint32 token_id        = 6;
    float  logprob         = 7;
    string finish_reason   = 8;
    optional LLMStreamFinalResult result = 10;
    LLMStreamEventKind event_kind = 12;
    string request_id = 13;
    string conversation_id = 14;
    int32 prompt_tokens_processed = 15;
    int32 completion_tokens_generated = 16;
    int64 elapsed_ms = 17;
    optional ToolCall tool_call = 18;
    optional SDKError error = 19;
}

// Tool-driven streaming uses this session path, not LLMGenerateRequest.
message ToolCallingSessionCreateRequest {
    string prompt = 1;
    optional LLMGenerationOptions generation = 2;

    // Unset preserves commons' secure default of validate=true.
    optional bool validate_calls = 3;

    repeated ChatMessage history = 4;
}

message ToolCallingSessionEvent {
    oneof kind {
        bytes llm_stream_event_bytes = 1;  // serialized LLMStreamEvent
        ToolCall tool_call = 2;
        ToolCallingResult final_result = 3;
        bytes error_bytes = 4;             // serialized SDKError
    }
    uint64 seq = 5;
}

// Hands a caller-executed tool result back into a running session.
message ToolCallingSessionStepWithResultRequest {
    uint64 session_handle = 1;
    string tool_call_id = 2;
    string result_json = 3;
    optional string error = 4;
}
