// RunAnywhere IDL — two-phase SDK initialization.
//
// The deterministic, linear step list (validate args, store creds, init state,
// authenticate, register device, fetch model assignments, flush telemetry,
// discover models) lives in commons. Platform SDKs still own their own
// concurrency primitive and any main-thread plugin registration.

syntax = "proto3";

package runanywhere.v1;

import "errors.proto";

option cc_enable_arenas         = true;
option java_multiple_files      = true;
option java_package             = "ai.runanywhere.proto.v1";
option java_outer_classname     = "SdkInitProto";
option objc_class_prefix        = "RAV1";
option csharp_namespace         = "Runanywhere.V1";
option swift_prefix             = "RA";
option go_package               = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

enum SdkInitPhase {
    SDK_INIT_PHASE_UNSPECIFIED = 0;
    SDK_INIT_PHASE_ONE         = 1;  // Synchronous core init, no network
    SDK_INIT_PHASE_TWO         = 2;  // Async services init, network
    SDK_INIT_PHASE_RETRY_HTTP  = 3;  // HTTP/auth retry after an offline init
}

// PRODUCTION is 2 because 1 was a staging value in shipped commons and
// xcframework builds. Do not renumber.
enum SdkInitEnvironment {
    SDK_INIT_ENVIRONMENT_DEVELOPMENT = 0;
    SDK_INIT_ENVIRONMENT_PRODUCTION  = 2;
}

// The only platform-supplied values commons cannot derive itself. Platform
// adapter callbacks are registered separately through rac_platform_adapter_t
// before this call; this message is purely the data envelope.
message SdkInitPhase1Request {
    SdkInitEnvironment environment = 1;
    string             api_key     = 2;  // May be empty in development mode.
    string             base_url    = 3;  // May be empty in development mode.
    string             device_id   = 4;  // Platform-resolved, e.g. a Keychain UUID.
    string             platform    = 5;
    string             sdk_version = 6;
}

// Most state is already resident in commons after Phase 1; these are the
// per-call hints that stay SDK-owned.
message SdkInitPhase2Request {
    string build_token                = 1;  // Dev-mode device registration token.
    bool   force_refresh_assignments  = 2;
    bool   flush_telemetry            = 3;
    bool   discover_downloaded_models = 4;  // Reconcile registry rows with local files.
    bool   rescan_local_models        = 5;
}

// Returned by Phase 1, Phase 2, and retryHTTP.
//
// A successful Phase 2 may still carry a warning: HTTP/auth setup is allowed
// to fail in offline mode, in which case error is unset, http_configured=false,
// and warning holds the offline notice while the SDK continues on cached
// models.
message SdkInitResult {
    SdkInitPhase phase                  = 1;
    SDKError     error                  = 3;
    bool         http_configured        = 4;  // HTTP transport wired at this call site.
    bool         device_registered      = 5;
    uint32       linked_models_count    = 6;  // Registry rows that linked to local files.
    uint32       discovered_orphans     = 7;  // On-disk folders with no registry row.
    string       warning                = 8;
    int64        duration_ms            = 9;

    // The cross-phase latched bit that survives between calls, as opposed to
    // http_configured, which describes only the calling phase. SDKs read this
    // to decide whether an authenticated call can proceed without a retryHTTP.
    bool         has_completed_http_setup = 10;

    // Whether this configuration has a usable credential and URL pair at all.
    // Local-only development builds set it false so platform SDKs stop
    // retrying HTTP on every guarded call.
    bool         http_applicable           = 11;
}
