// RunAnywhere IDL — pipeline graph specification.
//
// Consumed as the shape of the YAML pipeline config read by config_loader.cpp,
// not as a wire message.

syntax = "proto3";

package runanywhere.v1;

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "PipelineProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

message PipelineSpec {
    // e.g. "voice_agent_basic".
    string                 name      = 1;

    repeated OperatorSpec  operators = 2;
    repeated EdgeSpec      edges     = 3;
    PipelineOptions        options   = 4;
}

message OperatorSpec {
    string name = 1;
    string type = 2;
    map<string, string> params = 3;

    // Bypasses priority-based engine selection.
    string pinned_engine = 4;

    string model_id = 5;
    DeviceAffinity device = 6;
}

enum DeviceAffinity {
    DEVICE_AFFINITY_UNSPECIFIED = 0;
    DEVICE_AFFINITY_ANY         = 1;
    DEVICE_AFFINITY_CPU         = 2;
    DEVICE_AFFINITY_GPU         = 3;
    DEVICE_AFFINITY_ANE         = 4;   // Apple Neural Engine
}

message EdgeSpec {
    string from     = 1;
    string to       = 2;

    // Queue depth, and what happens when it fills.
    uint32 capacity = 3;
    EdgePolicy policy = 4;
}

enum EdgePolicy {
    EDGE_POLICY_UNSPECIFIED = 0;
    EDGE_POLICY_BLOCK       = 1;
    EDGE_POLICY_DROP_OLDEST = 2;
    EDGE_POLICY_DROP_NEWEST = 3;
}

message PipelineOptions {
    int32  latency_budget_ms = 1;
    bool   emit_metrics      = 2;

    // Reject a spec with unknown operators instead of skipping them.
    bool   strict_validation = 3;
}
