// RunAnywhere IDL — Voice Activity Detection (VAD) options & messages.
//
// VADEvent is not defined here; it lives in voice_events.proto.
// VADStreamEventKind below is the canonical VAD event enum.

syntax = "proto3";

package runanywhere.v1;

import "errors.proto";
import "model_types.proto";
import "rac_options.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "VadOptionsProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

enum SpeechActivityKind {
    SPEECH_ACTIVITY_KIND_UNSPECIFIED   = 0;
    SPEECH_ACTIVITY_KIND_SPEECH_STARTED = 1;
    SPEECH_ACTIVITY_KIND_SPEECH_ENDED   = 2;
    SPEECH_ACTIVITY_KIND_ONGOING        = 3;
}

// Load-time configuration for a VAD instance.
message VADConfiguration {
    // Empty when using the built-in energy VAD.
    string model_id              = 1;

    int32  sample_rate           = 2 [
        (runanywhere.v1.rac_default) = "16000",
        (runanywhere.v1.rac_min) = 8000,
        (runanywhere.v1.rac_max) = 48000
    ];

    // Milliseconds on the wire; Swift/Kotlin/Dart/C hold seconds, so generated
    // bindings divide by 1000 when they bind to those types.
    int32  frame_length_ms       = 3 [
        (runanywhere.v1.rac_default) = "100",
        (runanywhere.v1.rac_min) = 20,
        (runanywhere.v1.rac_max) = 1000
    ];

    // Commons rejects values outside [0, 1] and warns below 0.002 or above 0.1.
    float  activation_threshold  = 4 [
        (runanywhere.v1.rac_default) = "0.015",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 1.0
    ];

    // Calibrate against ambient noise and scale the threshold by
    // calibration_multiplier.
    bool   enable_auto_calibration = 5;

    // threshold = ambient noise * multiplier
    float  calibration_multiplier = 6 [
        (runanywhere.v1.rac_default) = "2.0",
        (runanywhere.v1.rac_min_float) = 1.2,
        (runanywhere.v1.rac_max_float) = 4.0
    ];

    optional InferenceFramework preferred_framework = 7;

    // For backend-specific VADs such as Silero ONNX.
    optional string model_path = 8;

    // 0 = backend default, for both of these.
    int32  window_size_samples = 9;
    int32  max_speech_duration_ms = 10;
}

// Per-call options. Field vocabulary follows LiveKit/Silero naming.
message VADOptions {
    // 0 = keep the configured threshold.
    float activation_threshold     = 6 [
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 1.0
    ];

    int32 min_speech_duration_ms   = 2 [(runanywhere.v1.rac_default) = "100"];
    int32 min_silence_duration_ms  = 3 [(runanywhere.v1.rac_default) = "300"];

    // 0 = backend default, for both of these.
    int32 max_speech_duration_ms    = 4 [(runanywhere.v1.rac_default) = "0"];

    // Audio retained before SPEECH_STARTED so segments don't clip the first
    // syllable.
    int32 prefix_padding_ms          = 7 [(runanywhere.v1.rac_default) = "0"];

    bool include_statistics          = 5;
}

message VADAudioSource {
    oneof source {
        bytes  audio_data     = 1;
        string adapter_handle = 2;
    }

    AudioEncoding encoding = 3;
    int32 sample_rate = 4;
    int32 channels = 5;
    int64 frame_offset_ms = 6;
}

message VADProcessRequest {
    string request_id = 1;
    optional VADAudioSource audio = 2;
    optional VADOptions options = 3;
    map<string, string> metadata = 4;
}

message VADResult {
    bool  is_speech    = 1;

    // [0.0, 1.0], backend-dependent.
    float confidence   = 2;

    // RMS energy of the analyzed frame.
    float energy       = 3;

    // Length of the analyzed frame.
    int32 duration_ms  = 4;

    // Milliseconds since epoch.
    int64 timestamp_ms = 5;

    // 0 = unset.
    int64 start_time_ms = 6;
    int64 end_time_ms   = 7;

    optional VADStatistics statistics = 8;
    optional SDKError error = 11;
}

// Exposed for debugging and waveform UIs.
message VADStatistics {
    float current_energy   = 1;
    float current_threshold = 2;

    // Ambient noise level captured by calibration.
    float ambient_level    = 3;

    // Moving-window average and peak.
    float recent_avg       = 4;
    float recent_max       = 5;

    // Zero = unset for energy-only implementations.
    int32 total_speech_segments     = 6;
    int64 total_speech_duration_ms  = 7;
    float average_energy            = 8;
    float peak_energy               = 9;
}

// Narrow component-level transition. voice_events.proto's VADEvent carries the
// broader pipeline taxonomy (BARGE_IN, END_OF_UTTERANCE) via VADStreamEventKind.
message SpeechActivityEvent {
    SpeechActivityKind event_type = 1;

    // Milliseconds since epoch.
    int64 timestamp_ms            = 2;

    // Length of the just-finished utterance on SPEECH_ENDED; zero on
    // SPEECH_STARTED.
    int32 duration_ms             = 3;

    float confidence              = 4;
    optional VADResult result     = 5;
    optional string segment_id    = 6;
}

enum VADStreamEventKind {
    VAD_STREAM_EVENT_KIND_UNSPECIFIED = 0;
    VAD_STREAM_EVENT_KIND_STARTED = 1;
    VAD_STREAM_EVENT_KIND_FRAME = 2;
    VAD_STREAM_EVENT_KIND_SPEECH_ACTIVITY = 3;
    VAD_STREAM_EVENT_KIND_STATISTICS = 4;
    VAD_STREAM_EVENT_KIND_STOPPED = 5;
    VAD_STREAM_EVENT_KIND_ERROR = 6;
    // Speech that interrupts active assistant playback. Downstream pipeline
    // also routes this through InterruptedEvent/InterruptReason.
    VAD_STREAM_EVENT_KIND_BARGE_IN = 7;
}

message VADStreamEvent {
    int64 timestamp_us = 2;
    string request_id = 3;
    VADStreamEventKind kind = 4;
    optional VADResult result = 5;
    optional SpeechActivityEvent activity = 6;
    optional VADStatistics statistics = 7;
    optional SDKError error = 10;
}

message VADServiceState {
    bool is_ready = 1;
    bool is_speech_active = 2;
    float energy_threshold = 3;
    int32 sample_rate = 4;
    int32 frame_length_ms = 5;
    optional string current_model = 6;
    optional SDKError error = 9;
}
