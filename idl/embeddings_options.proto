// RunAnywhere IDL — Embeddings configuration, options, vector, and result.

syntax = "proto3";

package runanywhere.v1;

import "model_types.proto";
import "rac_options.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "EmbeddingsOptionsProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

enum EmbeddingsNormalizeMode {
    EMBEDDINGS_NORMALIZE_MODE_UNSPECIFIED = 0;
    EMBEDDINGS_NORMALIZE_MODE_NONE        = 1;
    EMBEDDINGS_NORMALIZE_MODE_L2          = 2;
}

enum EmbeddingsPoolingStrategy {
    EMBEDDINGS_POOLING_STRATEGY_UNSPECIFIED = 0;
    EMBEDDINGS_POOLING_STRATEGY_MEAN        = 1;
    EMBEDDINGS_POOLING_STRATEGY_CLS         = 2;
    EMBEDDINGS_POOLING_STRATEGY_LAST        = 3;
}

// Applied at service creation.
message EmbeddingsConfiguration {
    // Registry id or local path.
    string        model_id              = 1 [(runanywhere.v1.rac_required) = true];

    // Must match the loaded model's hidden size: 384 for all-MiniLM-L6-v2,
    // 768 for bge-base, 1024 for bge-large.
    int32         embedding_dimension   = 2 [
        (runanywhere.v1.rac_default) = "384",
        (runanywhere.v1.rac_min) = 1
    ];

    // Truncation or sliding window past this length is backend-decided.
    int32         max_sequence_length   = 3 [
        (runanywhere.v1.rac_default) = "512",
        (runanywhere.v1.rac_min) = 1
    ];

    optional InferenceFramework preferred_framework = 5;

    EmbeddingsNormalizeMode normalize_mode = 7 [(runanywhere.v1.rac_default) = "EMBEDDINGS_NORMALIZE_MODE_L2"];
    EmbeddingsPoolingStrategy pooling      = 8 [(runanywhere.v1.rac_default) = "EMBEDDINGS_POOLING_STRATEGY_MEAN"];

    // Backend-specific config such as tokenizer or vocab companion paths.
    optional string config_json         = 9;
}

// Per-call overrides. Unset fields fall back to the component configuration.
message EmbeddingsOptions {
    // Truncate over-long inputs instead of erroring. Unset = backend default,
    // currently truncate-on-overflow for ONNX and sliding-window for llama.cpp.
    optional bool truncate   = 2;

    // Unset = backend chooses (512, capped at 8192).
    optional int32 batch_size = 3 [
        (runanywhere.v1.rac_min) = 1,
        (runanywhere.v1.rac_max) = 8192
    ];

    // UNSPECIFIED = use the component config.
    EmbeddingsNormalizeMode normalize_mode = 4 [(runanywhere.v1.rac_default) = "EMBEDDINGS_NORMALIZE_MODE_UNSPECIFIED"];
    EmbeddingsPoolingStrategy pooling      = 5;
    int32 n_threads                        = 6 [(runanywhere.v1.rac_default) = "0"];  // 0 = auto
}

message EmbeddingVector {
    // Length equals EmbeddingsResult.dimension.
    repeated float values = 1;

    // Populated when the backend computes it, letting consumers score
    // similarity without recomputing.
    optional float  norm   = 2;

    // Lets batch callers correlate vectors with inputs without tracking order.
    optional string text   = 3;

    int32 dimension        = 4;

    int32 input_index      = 5;
    map<string, string> metadata = 6;
}

// One text = embed, multiple texts = embed_batch.
message EmbeddingsRequest {
    repeated string texts = 1;
    optional EmbeddingsOptions options = 2;
    string request_id = 3;
    optional string model_id = 4;
    map<string, string> metadata = 5;
}

message EmbeddingsResult {
    // One vector per input text, in input order.
    repeated EmbeddingVector vectors            = 1;

    // Duplicated from each vector so consumers can size buffers in O(1).
    int32                    dimension          = 2;

    int64                    processing_time_ms = 3;

    // Across all inputs, post-truncation.
    int32                    tokens_used        = 4;

    optional string          model_id           = 5;
    optional string          error_message      = 6;
    int32                    error_code         = 7;
    string                   request_id         = 8;
}

message EmbeddingsCreateRequest {
    // Registry id or absolute model path.
    string model_id = 1;

    // Unset = commons defaults; set fields override per-component defaults.
    optional EmbeddingsConfiguration configuration = 2;

    // For backends needing companion file paths, e.g. {"vocab_path":"..."}.
    optional string config_json = 3;
}

message EmbeddingsCreateResult {
    // rac_handle_t cast to u64. Zero on failure.
    uint64 handle = 1;

    // Echoed so callers can store it beside the handle.
    string model_id = 2;

    // Backend-resolved after load. 0 = unknown until the first embed call.
    int32  dimension = 3;
    int32  max_tokens = 4;

    // Mirrors rac_result_t; negative on failure.
    int32  error_code = 5;
    string error_message = 6;
}
