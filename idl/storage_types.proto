// RunAnywhere IDL — storage metadata, availability checks, and delete planning.
//
// Platform adapters own directory resolution, sandbox handles, OS free-space
// facts, and any destructive file operation that needs platform participation.
// Commons handles aggregation, availability, planning, and scoped execution.

syntax = "proto3";

package runanywhere.v1;

import "errors.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "StorageTypesProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

enum NPUChip {
    NPU_CHIP_UNSPECIFIED         = 0;
    NPU_CHIP_NONE                = 1;
    NPU_CHIP_APPLE_NEURAL_ENGINE = 2;   // A-series and M-series
    NPU_CHIP_QUALCOMM_HEXAGON    = 3;
    NPU_CHIP_MEDIATEK_APU        = 4;   // Dimensity APU
    NPU_CHIP_GOOGLE_TPU          = 5;   // Pixel Tensor
    NPU_CHIP_INTEL_NPU           = 6;   // Core Ultra
    NPU_CHIP_OTHER               = 99;  // Detected but vendor unmapped
}

message DeviceStorageInfo {
    int64 total_bytes  = 1;
    int64 free_bytes   = 2;

    // Distinct from total-minus-free: this is the adapter's own reading of
    // occupied space, not a derivation. Kept live.
    int64 used_bytes   = 3;
    reserved 4;  // used_percent: derivable from used_bytes/total_bytes
}

message AppStorageInfo {
    int64 documents_bytes   = 1;
    int64 cache_bytes       = 2;
    int64 app_support_bytes = 3;
    int64 total_bytes       = 4;
}

message ModelStorageMetrics {
    string         model_id            = 1;
    int64          size_on_disk_bytes  = 2;
    reserved 3;  // last_used_ms -> ModelInfo.last_used_at_unix_ms
}

message StorageInfo {
    AppStorageInfo               app                 = 1;
    DeviceStorageInfo            device              = 2;
    repeated ModelStorageMetrics models              = 3;
    reserved 4;  // total_models: count over `models`
    // total_models_bytes (5) is NOT a pure derivation -- kept live; see
    // storage_event_publisher.cpp and two facade readers.
    int64                        total_models_bytes  = 5;
}

message StorageAvailability {
    bool            is_available     = 1;
    int64           required_bytes   = 2;
    int64           available_bytes  = 3;
    optional string warning_message  = 4;
    optional string recommendation   = 5;
    reserved 6, 7;  // shortfall = required - available; ratio from the same two
}

message StorageInfoRequest {
    bool include_device = 1;
    bool include_app    = 2;
    bool include_models = 3;
    bool include_cache  = 4;
}

message StorageInfoResult {
    StorageInfo info          = 2;
    repeated string warnings  = 4;
    optional SDKError error    = 5;
}

message StorageAvailabilityRequest {
    string model_id                  = 1;
    int64  required_bytes            = 2;
    reserved 3;  // was double safety_margin; 0.0 nullified the requirement

    // Absolute headroom the device must still have after the write. Same
    // unit and same name as DownloadPlanRequest.required_free_bytes_after_download.
    int64  required_free_bytes_after_download = 7;

    // Count bytes already occupied by this model as reclaimable.
    bool   include_existing_model_bytes = 4;

    bool   include_delete_plan       = 5;
    bool   allow_cache_reclamation   = 6;
}

message StorageAvailabilityResult {
    StorageAvailability availability  = 2;
    repeated string     warnings      = 3;
    optional StorageDeletePlan delete_plan = 5;
    optional SDKError   error         = 6;
}

message StorageDeletePlanRequest {
    repeated string model_ids       = 1;
    int64           required_bytes  = 2;
    bool            include_cache   = 3;

    // Evict by least-recently-used rather than by size.
    bool            oldest_first    = 4;

    bool            allow_loaded_models = 5;
    bool            include_download_partials = 6;
}

message StorageDeleteCandidate {
    string         model_id          = 1;
    int64          reclaimable_bytes = 2;
    reserved 3;  // last_used_ms -> ModelInfo.last_used_at_unix_ms
    bool           is_loaded         = 4;
    string         local_path        = 5;

    // Deleting this needs an unload first, or a platform-side delete.
    bool           requires_unload   = 6;
    bool           requires_platform_delete = 7;

    string         storage_key       = 8;
}

// Non-destructive: describes what could be reclaimed without doing it.
message StorageDeletePlan {
    bool                            can_reclaim_required_bytes = 1;
    int64                           required_bytes             = 2;
    int64                           reclaimable_bytes          = 3;
    repeated StorageDeleteCandidate candidates                 = 4;
    repeated string                 warnings                   = 5;
    bool                            requires_unload            = 7;
    bool                            requires_platform_delete   = 8;
    optional SDKError               error                      = 10;
    reserved 9;  // candidate_count == candidates.size()
}

message StorageDeleteRequest {
    repeated string model_ids            = 1;
    // Files are deleted; set this only to opt OUT (catalog-only bookkeeping).
    bool            keep_files_on_disk   = 2;
    bool            clear_registry_paths = 3;
    bool            unload_if_loaded     = 4;
    bool            dry_run              = 5;

    // Refuse to execute if the plan no longer matches current state.
    optional StorageDeletePlan plan      = 6;
    bool            require_plan_match   = 7;

    bool            allow_platform_delete = 8;
}

message StorageDeleteResult {
    int64           deleted_bytes     = 2;
    repeated string deleted_model_ids = 3;
    repeated string failed_model_ids  = 4;
    repeated string warnings          = 5;
    repeated string skipped_model_ids = 7;
    bool            dry_run           = 8;
    bool            registry_updated  = 9;
    bool            files_deleted     = 10;
    optional SDKError error           = 11;
}
