// RunAnywhere IDL — engine-router capability-query types.

syntax = "proto3";

package runanywhere.v1;

import "model_types.proto";
import "sdk_events.proto";

option cc_enable_arenas      = true;
option java_multiple_files   = true;
option java_package          = "ai.runanywhere.proto.v1";
option java_outer_classname  = "RouterProto";
option objc_class_prefix     = "RAV1";
option csharp_namespace      = "Runanywhere.V1";
option swift_prefix          = "RA";
option go_package            = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// Answers "which engines can run this capability on this host", from the
// engine-router plugin registry rather than the model registry, so it is
// independent of whether a matching model is registered.
message FrameworksForCapabilityRequest {
    SDKComponent component = 1;
}

// Ordered by the router's priority-descending scan of registered plugins.
// Duplicates removed, first-seen order preserved.
message FrameworksForCapabilityResponse {
    repeated InferenceFramework frameworks = 1;
}
