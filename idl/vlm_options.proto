// RunAnywhere IDL — Vision Language Model (VLM) types.

syntax = "proto3";

package runanywhere.v1;

import "chat.proto";
import "errors.proto";
import "llm_options.proto";
import "token_usage.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "VlmOptionsProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

enum VLMModelFamily {
    VLM_MODEL_FAMILY_UNSPECIFIED = 0;
    VLM_MODEL_FAMILY_AUTO        = 1;
    VLM_MODEL_FAMILY_QWEN2_VL    = 2;
    VLM_MODEL_FAMILY_SMOLVLM     = 3;
    VLM_MODEL_FAMILY_LLAVA       = 4;
    VLM_MODEL_FAMILY_CUSTOM      = 99;
}

message VLMChatTemplate {
    string template_text         = 1;
    optional string image_marker = 2;
    optional string default_system_prompt = 3;
}

// Pixel buffers are tightly packed with NO row padding: RGB is 3 bytes/px,
// RGBA is 4, and width * height * channels MUST equal the buffer length or
// the request is rejected. raw_rgba drops alpha at the boundary.
message VLMImage {
    oneof source {
        // Local file. The on-device analogue of a cloud Files-API file_id.
        string file_path = 1;

        // Compressed container bytes -- image/jpeg, image/png, image/webp.
        // Decoded by commons. Set media_type alongside. Same slot name and
        // meaning as ChatAttachment.data and Anthropic source.data.
        bytes  data      = 2;

        bytes  raw_rgb   = 3;   // 3 bytes/px
        string base64    = 4;   // same container formats as `data`, base64-encoded
        bytes  raw_rgba  = 12;  // 4 bytes/px; commons drops alpha
    }

    int32 width  = 5;   // required for raw_rgb / raw_rgba
    int32 height = 6;   // required for raw_rgb / raw_rgba

    // MIME type of `data`/`base64`. Required when either is set. An open
    // string, as everywhere in the industry, so adding HEIC is not a proto
    // change.
    string media_type = 8;

    reserved 7, 9, 10, 11;
    reserved "format", "name", "size_bytes", "metadata";
}

// VLMConfiguration is deleted: it had no adapter in commons -- max_tokens,
// temperature and system_prompt duplicated the live per-request fields with
// different defaults, streaming is chosen by which verb the app calls, and
// engine selection goes through the model registry.

message VLMGenerationRequest {
    string request_id = 1;
    repeated VLMImage images = 2;

    // Ordered conversation. A follow-up question about the same picture is
    // just another turn; images ride as ChatMessage.attachments.
    repeated ChatMessage messages = 8;

    // The question about the image, for the single-turn quickstart path.
    string prompt = 6;

    // One options set for all text generation, image or not -- same names,
    // same defaults, same validation as the text API. Carries
    // structured_output, which is how OCR / field extraction / bounding
    // boxes are expressed (deliberately no ocr() or detect() verb).
    optional LLMGenerationOptions options = 9;

    // Only the knobs that have no text-generation meaning.
    optional VLMVisionOptions vision = 7;

    optional string model_id = 4;

    reserved 3, 5;
    reserved "metadata";   // never read by commons; cloud-only concept
}

// The four genuinely vision-specific knobs. Everything else in the old
// VLMGenerationOptions was either a copy of LLMGenerationOptions or dead.
message VLMVisionOptions {
    VLMModelFamily model_family = 1;

    // Live end-to-end (commons converts it, llama.cpp applies it); it is
    // simply not surfaced by the v3 facades yet.
    optional VLMChatTemplate custom_chat_template = 2;

    optional string image_marker_override = 3;

    // Per-image vision-token budget -- the unit that actually drives
    // prefill (cf. llama.cpp --image-max-tokens, Gemini media_resolution).
    // 0 = the bundle's compiled default. The value actually used is
    // reported back as VLMResult.image_tokens.
    int32 max_image_tokens = 4;
}

// message VLMGenerationOptions is deleted. Its sampling fields were
// name-for-name copies of LLMGenerationOptions (11 of them, with three
// drifted defaults); max_image_size and use_gpu were converted at the C
// boundary and read by no engine; emit_image_embeddings IS read by
// llama.cpp but is inert there.

message VLMResult {
    reserved 2, 3, 4, 6, 11, 12;   // pre-existing tag gaps

    string text                = 1;

    // Wall-clock for the whole call, image encode included. int64 ms is the
    // unit for every duration on this surface; the _ms suffix stays explicit.
    int64  total_time_ms       = 5;

    int32  image_tokens             = 7;
    reserved 8;  // was time_to_first_token_ms -- TokenUsage.ttft_ms is the
                 // canonical spelling (usage = 15)
    int64  image_encode_time_ms     = 9;

    // Produced by commons on both the one-shot and the streaming path, with
    // the LLM domain's vocabulary: "stop" | "length" | "stop_sequence".
    string finish_reason            = 13;

    TokenUsage usage                = 15;
    optional SDKError error         = 16;

    reserved 10, 14;
    reserved "hardware_used", "images_processed";
}

enum VLMStreamEventKind {
    VLM_STREAM_EVENT_KIND_UNSPECIFIED = 0;
    VLM_STREAM_EVENT_KIND_STARTED = 1;

    // Emitted when the vision encoder finishes and decoding begins -- the
    // cue for a UI to switch from "analysing image" to "writing". Emitted
    // where the backend measures the encode boundary
    // (VLMResult.image_encode_time_ms comes from the same measurement).
    VLM_STREAM_EVENT_KIND_IMAGE_ENCODED = 2;

    VLM_STREAM_EVENT_KIND_TOKEN = 3;
    VLM_STREAM_EVENT_KIND_COMPLETED = 4;
    VLM_STREAM_EVENT_KIND_ERROR = 5;
}

message VLMStreamEvent {
    reserved 1, 10, 11;   // pre-existing tag gaps

    int64 timestamp_us = 2;
    string request_id = 3;

    // The single terminal discriminator: COMPLETED or ERROR ends the stream.
    VLMStreamEventKind kind = 4;

    string token = 5;
    int32 token_index = 6;

    // Rate comes from result.usage.tokens_per_second on the terminal event,
    // in TokenUsage's own type. No second copy, no second scalar type.
    optional VLMResult result = 9;
    optional SDKError error = 12;

    reserved 7, 8;
    reserved "is_final", "tokens_per_second";
}

// VLMServiceState is deleted: it had no emitter. The equivalent data
// already lives in C as rac_vlm_info_t; expose it when there is a producer.
