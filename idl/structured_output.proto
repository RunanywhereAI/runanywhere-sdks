// RunAnywhere IDL — structured output (JSON Schema, regex, grammar).
//
// Structured GENERATION is LLMGenerationOptions.structured_output on the
// ordinary LLM request (llm_options.proto), which already carries
// max_output_tokens, temperature, stop_sequences and system_prompt.
//
// What remains here is the extract / validate / prepare-prompt surface. Those
// entry points are first-class C ABI calls, not service RPCs: they consume
// StructuredOutputParseRequest and emit StructuredOutputResult,
// StructuredOutputValidation or StructuredOutputPromptResult directly.

syntax = "proto3";

package runanywhere.v1;

import "errors.proto";
import "rac_options.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "StructuredOutputProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// How commons applies StructuredOutputOptions on the ordinary LLM generate
// path. Platform SDKs must not invent a second policy.
enum StructuredOutputMode {
    STRUCTURED_OUTPUT_MODE_UNSPECIFIED = 0;
    // Compile schema→GBNF (or honor grammar/regex) and constrain decoding.
    STRUCTURED_OUTPUT_MODE_CONSTRAINED = 1;
    // Do not constrain decoding; validate the free-text result against schema.
    STRUCTURED_OUTPUT_MODE_VALIDATION_ONLY = 2;
    // Constrained (when a decoder arm is present), then one repair retry if
    // the first answer fails schema validation.
    STRUCTURED_OUTPUT_MODE_REPAIR = 3;
}

message StructuredOutputOptions {
    // Also render the schema into the system prompt, not just constrain
    // decoding. Costs input tokens and invalidates the thread's prompt cache.
    // Default true (matches Apple FoundationModels includeSchemaInPrompt).
    optional bool  include_schema_in_prompt = 1 [
        (runanywhere.v1.rac_default) = "true"
    ];

    // Exactly one arm; the arm selects the constraint kind. Absent = free text.
    // A present arm constrains the DECODER. An engine that cannot enforce the
    // arm it was given fails the call; it never degrades to free generation.
    oneof constraint {
        // A JSON Schema document, verbatim. Unsupported keywords are rejected.
        // Commons compiles this to GBNF on the generate path (mode permitting).
        string schema  = 2;
        // GBNF/EBNF grammar text. On-device only.
        string grammar = 3;
        // Regular expression the whole output must match. On-device only.
        string regex   = 4;
    }

    // Unset = CONSTRAINED when a constraint arm is present, else free text.
    optional StructuredOutputMode mode = 5;
}

message StructuredOutputValidation {
    bool            is_valid          = 1;
    bool            contains_json     = 2;
    optional string raw_output        = 3;
    optional string extracted_json    = 4;
    repeated string validation_errors = 5;
    int64           validation_time_ms = 6;
    optional SDKError error            = 7;
    // True when commons issued the single repair retry (mode=REPAIR).
    bool            repair_attempted   = 8;
    // 0 = first pass only; 1 = repair pass produced the reported verdict.
    int32           repair_attempts    = 9;
}

message StructuredOutputResult {
    // The extracted JSON document, as UTF-8 text. Parse it client-side.
    string                      json        = 1;
    StructuredOutputValidation  validation  = 2;
    optional string             raw_text    = 3;
    optional SDKError           error       = 4;
}

message StructuredOutputParseRequest {
    string request_id = 1;
    string text = 2;
    optional StructuredOutputOptions options = 3;
    map<string, string> metadata = 4;
}

message StructuredOutputPromptResult {
    string prepared_prompt = 1;
    optional string system_prompt = 2;
    optional string json_schema = 3;
    optional string regex_pattern = 4;
    optional string grammar = 5;
    optional SDKError error = 6;
}
