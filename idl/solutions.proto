// RunAnywhere IDL — prebuilt solution configs.
//
// Consumed as the shape of the YAML solution config read by config_loader.cpp,
// not as a wire message. Solution lifecycle verbs mirror rac_solution_handle_t.

syntax = "proto3";

package runanywhere.v1;

import "llm_options.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "SolutionsProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

message SolutionConfig {
    oneof config {
        VoiceAgentConfig voice_agent = 1;
        RAGConfig        rag         = 2;
        AgentLoopConfig  agent_loop  = 4;
        TimeSeriesConfig time_series = 5;
    }
}

// Frontends switch on the SolutionConfig oneof case. This enum exists only
// for logs and handles, and its numbers now match the oneof tags.
enum SolutionType {
    SOLUTION_TYPE_UNSPECIFIED = 0;
    SOLUTION_TYPE_VOICE_AGENT = 1;   // SolutionConfig.voice_agent = 1
    SOLUTION_TYPE_RAG         = 2;   // SolutionConfig.rag         = 2
    SOLUTION_TYPE_AGENT_LOOP  = 4;   // SolutionConfig.agent_loop  = 4
    SOLUTION_TYPE_TIME_SERIES = 5;   // SolutionConfig.time_series = 5
}

message SolutionHandle {
    string handle_id        = 1;
    string solution_type    = 2;
    int64  created_at_ms    = 3;

    // Engine-specific, e.g. "running" or "stopped".
    optional string state   = 4;
}

message VoiceAgentConfig {
    string llm_model_id = 1;
    string stt_model_id = 2;
    string tts_model_id = 3;
    string vad_model_id = 4;
    string tts_voice_id = 5;

    int32  sample_rate_hz = 6;
    int32  chunk_ms       = 7;

    // audio_file_path applies when audio_source is FILE.
    AudioSource audio_source = 8;
    string audio_file_path = 9;

    // Unset means enabled.
    optional bool enable_barge_in = 10;
    int32  barge_in_threshold_ms = 11;

    optional LLMGenerationOptions generation = 12;
    int32  max_context_tokens = 13;

    // Emit partial transcripts as non-final user-said events.
    bool   emit_partials = 14;
}

enum AudioSource {
    AUDIO_SOURCE_UNSPECIFIED = 0;
    AUDIO_SOURCE_MICROPHONE  = 1;
    AUDIO_SOURCE_FILE        = 2;
    AUDIO_SOURCE_CALLBACK    = 3;   // Frontend feeds frames through the C ABI
}

message RAGConfig {
    string embed_model_id  = 1;
    string rerank_model_id = 2;
    string llm_model_id    = 3;

    VectorStore vector_store = 4;
    string      vector_store_path = 5;

    // Retrieve this many candidates, then keep this many after reranking.
    int32  retrieve_k = 6;
    int32  rerank_top = 7;

    // BM25 term-saturation and length-normalization parameters.
    float  bm25_k1 = 8;
    float  bm25_b  = 9;

    // Reciprocal-rank-fusion smoothing constant.
    int32  rrf_k   = 10;

    string prompt_template = 11;
}

enum VectorStore {
    VECTOR_STORE_UNSPECIFIED = 0;
    VECTOR_STORE_USEARCH     = 1;  // in-process HNSW
    VECTOR_STORE_PGVECTOR    = 2;  // server deployments only, no on-device path
}

message AgentLoopConfig {
    string llm_model_id = 1;
    string system_prompt = 2;
    repeated ToolSpec tools = 3;
    int32  max_iterations = 4;
    int32  max_context_tokens = 5;
}

message ToolSpec {
    string name        = 1;
    string description = 2;

    // OpenAI-compatible parameters schema.
    string json_schema = 3;
}

message TimeSeriesConfig {
    string anomaly_model_id = 1;
    string llm_model_id     = 2;

    // Samples per window, and how far the window advances each step.
    int32  window_size      = 3;
    int32  stride           = 4;

    float  anomaly_threshold = 5;
}
