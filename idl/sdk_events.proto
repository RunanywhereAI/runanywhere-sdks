// RunAnywhere IDL — canonical SDK event surface.
//
// SINGLE CANONICAL EVENT CATALOG. This file is the one place every SDK event
// is declared. See the sectioned banners below: definitions are grouped by
// component and ordered to match the `SDKComponent` enum
//   (Envelope/Shared → Lifecycle → Generation(LLM/VLM) → STT → TTS → VAD →
//    Embeddings → Diffusion → RAG → LoRA → Model/Download/Storage → Infra).
// Several SDK components share one consolidated message (e.g. STT/TTS/VAD all
// flow through `VoiceLifecycleEvent`; VLM/Diffusion/Embeddings/RAG/LoRA all
// flow through `CapabilityOperationEvent`); each banner names the components it
// covers. Field numbers, message names, enum names, and enum values are
// wire-stable — sections only group/order what already exists.
//
// This proto REPLACES React Native's hand-written `events.ts` (337 LOC,
// 11 event union variants, ~70+ specific event variants) and unifies
// eventing across Swift, Kotlin, Dart, RN, and Web SDKs.
//
// Pre-IDL drift table (sources consolidated here):
//   RN     events.ts:1-337                 — 337 LOC, 11 union types, ~70 variants (PRIMARY SOURCE)
//   RN     enums.ts:168-176 (SDKComponent) — 7 component cases (LLM/STT/TTS/VAD/Embedding/SpeakerDiarization/VoiceAgent)
//   RN     enums.ts:270-283 (SDKEventType) — 11 category cases
//   Swift  SDKEvent.swift:1-77             — 77 LOC, protocol-only (id/type/category/timestamp/sessionId/destination/properties)
//   Swift  EventCategory                   — 11 category cases
//   Kotlin SDKEvent.kt:1-400               — 400 LOC, sealed-style data classes
//                                             (SDKLifecycleEvent, ModelEvent, LLMEvent, STTEvent, TTSEvent, ErrorEvent, RAGEvent)
//   Dart   sdk_event.dart:1-871            — 871 LOC, abstract classes per category
//                                             (Initialization, Configuration, Generation, Model, Voice, Device, Storage, RAG)
//
// Total: 1,685 LOC of platform-divergent event types collapsed to a single
// envelope (`SDKEvent`) + 11 category messages with strongly-typed `oneof`
// payloads. Every field below is the union of cases declared somewhere
// pre-IDL, so adding a SDK consumer never requires re-running drift checks
// against hand-written event hierarchies.
//
// Design choices:
//   • Composition over deep enum hierarchies — every event-type message is
//     a flat struct, and the discrimination is via `oneof event` on the
//     top-level `SDKEvent` envelope.
//   • Reuses voice_events.proto's `VoiceEvent` for streaming voice-pipeline
//     events (UserSaid / AssistantToken / AudioFrame / VAD / Interrupted /
//     StateChange / Error / Metrics). This file's `VoiceEvent` field
//     covers higher-level lifecycle/session events that don't fit the
//     pipeline streaming model (recording start/stop, playback, voice
//     session orchestration).
//   • Matches model_types.proto header/options exactly.

syntax = "proto3";

package runanywhere.v1;

import "component_types.proto";
import "download_service.proto";
import "errors.proto";
import "model_types.proto";
import "rac_options.proto";
import "storage_types.proto";
import "voice_events.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "SdkEventsProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// ===========================================================================
// SECTION 0 — ENVELOPE / SHARED ENUMS
// ===========================================================================
// Cross-cutting enums referenced by the `SDKEvent` envelope and by many of the
// per-component messages below: the component identifier and the routing
// destination. (The `EventCategory` enum carried by the envelope lives in
// component_types.proto to break the sdk_events ↔ voice_events import cycle.)
// The envelope message `SDKEvent` itself, plus the filter/request/result
// messages and the `SDKEvents` service, are defined last (SECTION 14) because
// they reference every per-component message above.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Component identifier — every consumer / framework that the SDK orchestrates.
// Sources pre-IDL:
//   RN     enums.ts:168 (SDKComponent)             — 7 cases
//   Swift  ComponentTypes.swift:SDKComponent       — 7 cases
//   Kotlin ComponentTypes.kt:SDKComponent          — 7 cases
//   Dart   sdk_component.dart                      — 7 cases
// Canonical superset adds: VLM, DIFFUSION, RAG, WAKEWORD (referenced by
// RN's ComponentInitializationEvent.components: SDKComponent[] but not yet
// in any SDK's enum).
// ---------------------------------------------------------------------------
// The rac_wire_string values are the stable lowercase keys that SDKError.component
// carries; producers stringify through them, never through the constant name.
enum SDKComponent {
    SDK_COMPONENT_UNSPECIFIED           = 0  [(runanywhere.v1.rac_wire_string) = "unspecified"];
    SDK_COMPONENT_STT                   = 1  [(runanywhere.v1.rac_wire_string) = "stt"];
    SDK_COMPONENT_TTS                   = 2  [(runanywhere.v1.rac_wire_string) = "tts"];
    SDK_COMPONENT_VAD                   = 3  [(runanywhere.v1.rac_wire_string) = "vad"];
    SDK_COMPONENT_LLM                   = 4  [(runanywhere.v1.rac_wire_string) = "llm"];
    SDK_COMPONENT_VLM                   = 5  [(runanywhere.v1.rac_wire_string) = "vlm"];
    SDK_COMPONENT_DIFFUSION             = 6  [(runanywhere.v1.rac_wire_string) = "diffusion"];
    SDK_COMPONENT_RAG                   = 7  [(runanywhere.v1.rac_wire_string) = "rag"];
    SDK_COMPONENT_EMBEDDINGS            = 8  [(runanywhere.v1.rac_wire_string) = "embeddings"];
    SDK_COMPONENT_VOICE_AGENT           = 9  [(runanywhere.v1.rac_wire_string) = "voice_agent"];
    SDK_COMPONENT_WAKEWORD              = 10 [(runanywhere.v1.rac_wire_string) = "wakeword"];
    SDK_COMPONENT_SPEAKER_DIARIZATION   = 11 [(runanywhere.v1.rac_wire_string) = "speaker_diarization"];
    SDK_COMPONENT_SEMANTIC_SEGMENTATION = 12 [(runanywhere.v1.rac_wire_string) = "semantic_segmentation"];
    SDK_COMPONENT_RERANK                = 13 [(runanywhere.v1.rac_wire_string) = "rerank"];
    SDK_COMPONENT_OCR                   = 14 [(runanywhere.v1.rac_wire_string) = "ocr"];
}

// ---------------------------------------------------------------------------
// Where an event should be routed. Mirrors Swift `EventDestination` /
// Kotlin `EventDestination` / Dart `EventDestination`.
// Sources pre-IDL:
//   Swift  SDKEvent.swift:15-22       — publicOnly / analyticsOnly / all
//   Kotlin SDKEvent.kt:24-33          — PUBLIC_ONLY / ANALYTICS_ONLY / ALL
//   Dart   sdk_event.dart:20-29       — all / publicOnly / analyticsOnly
// ---------------------------------------------------------------------------
// Bitmask routing destination. Values are powers of two so they can be OR'd
// together; proto3 enums are open ints, so combinations round-trip on the wire
// without named constants. The C++ destination router reads this as a bitmask.
//   PUBLIC    — app-facing canonical SDKEvent proto stream
//   TELEMETRY — telemetry_manager / server analytics
//   LOG       — structured local log sink (opt-in)
//   ALL       — PUBLIC | TELEMETRY (legacy "all" parity; the publish() default)
enum EventDestination {
    EVENT_DESTINATION_UNSPECIFIED = 0;
    EVENT_DESTINATION_PUBLIC      = 1;
    EVENT_DESTINATION_TELEMETRY   = 2;
    EVENT_DESTINATION_ALL         = 3;   // PUBLIC | TELEMETRY
    EVENT_DESTINATION_LOG         = 4;
}

// ===========================================================================
// SECTION 1 — LIFECYCLE (ALL COMPONENTS)
// ===========================================================================
// SDK-wide lifecycle/init, configuration, per-component init lifecycle, the
// operation-aware component lifecycle event + its snapshot helpers, and SDK
// session lifecycle. These span every component rather than any single one.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// SDK lifecycle / initialization stage events. Mirrors
//   RN  events.ts:38-43 (SDKInitializationEvent: 5 variants)
// Plus integrated "configurationLoaded" source field. NOT to be confused
// with `ComponentInitializationEvent` (per-component lifecycle).
// ---------------------------------------------------------------------------
message InitializationEvent {
    InitializationStage stage     = 1;
    string              source    = 2;   // for `CONFIGURATION_LOADED` (e.g. "remote", "local", "builtin")
    string              error     = 3;   // populated when stage == FAILED
    string              version   = 4;   // SDK version (Kotlin SDKLifecycleEvent.version)
}

enum InitializationStage {
    INITIALIZATION_STAGE_UNSPECIFIED            = 0;
    INITIALIZATION_STAGE_STARTED                = 1;
    INITIALIZATION_STAGE_CONFIGURATION_LOADED   = 2;
    INITIALIZATION_STAGE_SERVICES_BOOTSTRAPPED  = 3;
    INITIALIZATION_STAGE_COMPLETED              = 4;
    INITIALIZATION_STAGE_FAILED                 = 5;
    INITIALIZATION_STAGE_SHUTDOWN               = 6;   // Kotlin SDKLifecycleEvent.SHUTDOWN
}

// ---------------------------------------------------------------------------
// Configuration events — fetch / load / sync / settings retrieval / privacy /
// routing-policy / analytics-status changes. Mirrors RN
//   events.ts:49-66 (SDKConfigurationEvent: 17 variants).
// ---------------------------------------------------------------------------
message ConfigurationEvent {
    ConfigurationEventKind kind             = 1;

    // Source of configuration (`fetchCompleted.source`, `loaded.source`, …).
    string                 source           = 2;

    // Populated on FAILED variants (fetchFailed / syncFailed).
    string                 error            = 3;

    // List of changed top-level keys (configurationUpdated). Kept as
    // strings since each SDK uses different KV value types; analytics
    // only cares about which keys moved.
    repeated string        changed_keys     = 4;

    // For settings_retrieved — the resulting settings serialized as JSON.
    // Avoids embedding DefaultGenerationSettings here (lives in llm_options
    // / config protos).
    string                 settings_json    = 5;

    // For routing_policy_retrieved (RN events.ts:62 — `policy: string`).
    string                 routing_policy   = 6;

    // For privacy_mode_retrieved (RN events.ts:64).
    string                 privacy_mode     = 7;

    // For analytics_status_retrieved (RN events.ts:66 — `enabled: boolean`).
    bool                   analytics_enabled = 8;

    // Old / new value pairs for config_changed (canonical primitive
    // representation). Both stored as JSON-encoded strings to avoid
    // dragging a dynamic-typed `Value` into the schema.
    string                 old_value_json   = 9;
    string                 new_value_json   = 10;
}

enum ConfigurationEventKind {
    CONFIGURATION_EVENT_KIND_UNSPECIFIED                 = 0;
    CONFIGURATION_EVENT_KIND_FETCH_STARTED               = 1;
    CONFIGURATION_EVENT_KIND_FETCH_COMPLETED             = 2;
    CONFIGURATION_EVENT_KIND_FETCH_FAILED                = 3;
    CONFIGURATION_EVENT_KIND_LOADED                      = 4;
    CONFIGURATION_EVENT_KIND_UPDATED                     = 5;
    CONFIGURATION_EVENT_KIND_SYNC_STARTED                = 6;
    CONFIGURATION_EVENT_KIND_SYNC_COMPLETED              = 7;
    CONFIGURATION_EVENT_KIND_SYNC_FAILED                 = 8;
    CONFIGURATION_EVENT_KIND_CHANGED                     = 18;   // generic config_changed (Kotlin/Dart)

    // Deleted: the 4 getter-echo pairs (SETTINGS_/ROUTING_POLICY_/
    // PRIVACY_MODE_/ANALYTICS_STATUS_ REQUESTED+RETRIEVED) and the
    // standalone SYNC_REQUESTED echo.
    reserved 9 to 17;
}

// ComponentInitializationEvent was deleted: its fields and kinds moved into
// ComponentLifecycleEvent / ComponentLifecycleEventKind below. Bring-up and
// steady-state lifecycle are the same subject; they now share one message.

// Snapshot of a component's current model-backed lifecycle state.
message ComponentLifecycleSnapshot {
    SDKComponent            component     = 1;
    ComponentLifecycleState state         = 2;
    string                  model_id      = 3;
    int64                   updated_at_ms = 4;
    ModelCategory           category      = 6;
    InferenceFramework      framework     = 7;
    string                  resolved_path = 8;
    int64                   loaded_at_unix_ms = 9;
    ModelInfo               model         = 10;
    optional SDKError       error         = 11;
}

message ComponentLifecycleSnapshotResult {
    repeated ComponentLifecycleSnapshot snapshots = 2;
    optional SDKError error = 4;
}

// Operation-aware lifecycle event. The oneof arms intentionally reference the
// operation result/progress protos from this contract slice instead of adding
// another broad event taxonomy. Covers both component bring-up (absorbed from
// ComponentInitializationEvent) and steady-state model lifecycle.
message ComponentLifecycleEvent {
    ComponentLifecycleEventKind kind           = 19;
    SDKComponent            component      = 1;
    ComponentLifecycleState previous_state = 2;
    ComponentLifecycleState current_state  = 3;
    string                  model_id       = 4;
    int64                   timestamp_ms   = 5;

    // Absorbed from ComponentInitializationEvent.
    int64                    size_bytes          = 20;   // COMPONENT_DOWNLOAD_REQUIRED
    float                    progress            = 21;   // COMPONENT_DOWNLOAD_PROGRESS
    repeated SDKComponent    components          = 22;    // multi-component events
    repeated SDKComponent    ready_components    = 23;
    repeated SDKComponent    pending_components  = 24;
    int32                    ready_count         = 25;    // INITIALIZATION_COMPLETED summary
    int32                    failed_count        = 26;
    optional SDKError        error               = 27;

    oneof payload {
        ModelLoadResult       model_load_result        = 10;
        ModelUnloadResult     model_unload_result      = 11;
        ModelDeleteResult     model_delete_result      = 12;
        DownloadProgress      download_progress        = 13;
        StorageAvailabilityResult storage_availability = 14;
        StorageDeleteResult   storage_delete_result    = 15;
        ComponentLifecycleSnapshot snapshot             = 16;
        ComponentLifecycleSnapshotResult snapshot_result = 17;
        StorageDeletePlan     storage_delete_plan       = 18;
    }
}

enum ComponentLifecycleEventKind {
    COMPONENT_LIFECYCLE_EVENT_KIND_UNSPECIFIED                = 0;
    COMPONENT_LIFECYCLE_EVENT_KIND_STATE_CHANGED              = 1;   // previous_state -> current_state carries this
    COMPONENT_LIFECYCLE_EVENT_KIND_MODEL_LOAD_COMPLETED       = 2;
    COMPONENT_LIFECYCLE_EVENT_KIND_MODEL_UNLOAD_COMPLETED     = 3;
    COMPONENT_LIFECYCLE_EVENT_KIND_MODEL_DELETE_COMPLETED     = 4;
    COMPONENT_LIFECYCLE_EVENT_KIND_DOWNLOAD_PROGRESS          = 5;
    COMPONENT_LIFECYCLE_EVENT_KIND_STORAGE_AVAILABILITY       = 6;
    COMPONENT_LIFECYCLE_EVENT_KIND_STORAGE_DELETE_COMPLETED   = 7;
    COMPONENT_LIFECYCLE_EVENT_KIND_SNAPSHOT                   = 8;
    COMPONENT_LIFECYCLE_EVENT_KIND_SNAPSHOT_RESULT             = 9;
    COMPONENT_LIFECYCLE_EVENT_KIND_STORAGE_DELETE_PLAN         = 10;

    // Absorbed from ComponentInitializationEventKind.
    COMPONENT_LIFECYCLE_EVENT_KIND_INITIALIZATION_STARTED      = 11;
    COMPONENT_LIFECYCLE_EVENT_KIND_INITIALIZATION_COMPLETED    = 12;
    COMPONENT_LIFECYCLE_EVENT_KIND_COMPONENT_CHECKING          = 13;
    COMPONENT_LIFECYCLE_EVENT_KIND_COMPONENT_DOWNLOAD_REQUIRED  = 14;
    // _STARTED/_COMPLETED deleted: duplicates of ModelEventKind's
    // MODEL_EVENT_KIND_DOWNLOAD_STARTED/COMPLETED, the one place download
    // progress now lives.
    reserved 15, 16;
    COMPONENT_LIFECYCLE_EVENT_KIND_COMPONENT_INITIALIZING       = 17;
    COMPONENT_LIFECYCLE_EVENT_KIND_COMPONENT_READY              = 18;
    COMPONENT_LIFECYCLE_EVENT_KIND_COMPONENT_FAILED             = 19;
    COMPONENT_LIFECYCLE_EVENT_KIND_PARALLEL_INIT_STARTED        = 20;
    COMPONENT_LIFECYCLE_EVENT_KIND_SEQUENTIAL_INIT_STARTED      = 21;
    COMPONENT_LIFECYCLE_EVENT_KIND_ALL_COMPONENTS_READY         = 22;
    COMPONENT_LIFECYCLE_EVENT_KIND_SOME_COMPONENTS_READY        = 23;
}

// SDK session lifecycle independent of voice-agent turn sessions.
message SessionEvent {
    SessionEventKind kind = 1;
    string           session_id = 2;
    string           user_id = 3;
    string           reason = 4;
    string           error = 5;
    int64            started_at_ms = 6;
    int64            ended_at_ms = 7;
}

enum SessionEventKind {
    SESSION_EVENT_KIND_UNSPECIFIED = 0;
    SESSION_EVENT_KIND_CREATED     = 1;
    SESSION_EVENT_KIND_STARTED     = 2;
    SESSION_EVENT_KIND_RESUMED     = 3;
    SESSION_EVENT_KIND_PAUSED      = 4;
    SESSION_EVENT_KIND_ENDED       = 5;
    SESSION_EVENT_KIND_EXPIRED     = 6;
    SESSION_EVENT_KIND_FAILED      = 7;
}

// ===========================================================================
// SECTION 2 — GENERATION (LLM / VLM)
// ===========================================================================
// Text/multimodal generation lifecycle. `GenerationEvent` covers LLM (and the
// shared LLM-backed path of VLM) token/streaming/cost/routing/tool/structured/
// thinking events. VLM image-conditioned generation also surfaces through
// `CapabilityOperationEvent` (SECTION 7) for its VLM_* kinds.
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// LLM generation events. Mirrors RN
//   events.ts:72-89 (SDKGenerationEvent: 12 variants).
// Plus Kotlin LLMEvent (5 variants), Dart SDKGenerationEvent (4 factories).
// ---------------------------------------------------------------------------
message GenerationEvent {
    GenerationEventKind kind             = 1;

    // Optional session id (RN voiceSession_*, generationStarted.sessionId).
    string              session_id       = 2;

    // For STARTED — the prompt text (RN events.ts:75).
    string              prompt           = 3;

    // For TOKEN_GENERATED / FIRST_TOKEN_GENERATED — single token text.
    string              token            = 4;

    // For STREAMING_UPDATE — the running response text.
    string              streaming_text   = 5;

    // Output tokens so far on STREAMING_UPDATE; the final count on COMPLETED.
    int32               output_tokens    = 6;

    // For COMPLETED — full response.
    string              response         = 7;

    // For FAILED.
    string              error            = 8;

    // For MODEL_LOADED / MODEL_UNLOADED — bound model.
    string              model_id         = 9;

    reserved 10, 11;  // were unused cost_amount / cost_saved_amount

    // For ROUTING_DECISION.
    string              routing_target   = 12;
    string              routing_reason   = 13;

    // For cancellation / tool / structured-output / thinking events.
    string              cancel_reason    = 14;
    string              tool_call_id      = 15;
    string              tool_name         = 16;
    string              tool_payload_json = 17;
    string              structured_schema_json = 18;
    string              structured_output_json = 19;
    string              thinking_text     = 20;

    // Prompt-token count on COMPLETED. Total = input_tokens + output_tokens.
    int32               input_tokens     = 21;

    // Telemetry metrics carried on the canonical event stream so the C++
    // destination router can derive the full telemetry payload from the
    // proto SDKEvent alone (no parallel struct path).
    double              tokens_per_second        = 22;

    // Time to first token, whichever kind reports it.
    int64               time_to_first_token_ms   = 23;

    bool                is_streaming             = 24;
    float               temperature              = 25;
    int32               max_tokens               = 26;
    int32               context_length           = 27;
    string              model_name               = 28;

    // Whole-generation wall clock.
    int64               total_duration_ms        = 29;

    InferenceFramework  framework                = 30;

    // Prefill (prompt eval) wall clock.
    int64               prefill_duration_ms      = 31;
}

enum GenerationEventKind {
    GENERATION_EVENT_KIND_UNSPECIFIED            = 0;

    // Sessions -> SessionEventKind. Model load/unload -> ModelEventKind.
    // Cancel-requested -> CancellationEventKind. Cost -> the cost_amount /
    // cost_saved_amount fields on the COMPLETED event. STREAM_COMPLETED ->
    // COMPLETED (read is_streaming).
    reserved 1, 2, 9, 10, 11, 13, 14;

    GENERATION_EVENT_KIND_STARTED                = 3;
    GENERATION_EVENT_KIND_FIRST_TOKEN_GENERATED  = 4;
    GENERATION_EVENT_KIND_TOKEN_GENERATED        = 5;
    GENERATION_EVENT_KIND_STREAMING_UPDATE       = 6;

    // Exactly one success terminal, one failure terminal, one cancel terminal.
    GENERATION_EVENT_KIND_COMPLETED              = 7;
    GENERATION_EVENT_KIND_FAILED                 = 8;
    GENERATION_EVENT_KIND_ROUTING_DECISION       = 12;
    GENERATION_EVENT_KIND_CANCELLED              = 15;
    GENERATION_EVENT_KIND_TOOL_CALL_STARTED      = 16;
    GENERATION_EVENT_KIND_TOOL_CALL_COMPLETED    = 17;
    GENERATION_EVENT_KIND_TOOL_CALL_FAILED       = 18;
    GENERATION_EVENT_KIND_STRUCTURED_OUTPUT_STARTED = 19;
    GENERATION_EVENT_KIND_STRUCTURED_OUTPUT_COMPLETED = 20;
    GENERATION_EVENT_KIND_STRUCTURED_OUTPUT_FAILED = 21;
    GENERATION_EVENT_KIND_THINKING_STARTED       = 22;
    GENERATION_EVENT_KIND_THINKING_DELTA         = 23;
    GENERATION_EVENT_KIND_THINKING_COMPLETED     = 24;
}

// ===========================================================================
// SECTION 3 — STT / SECTION 4 — TTS / SECTION 5 — VAD (voice lifecycle)
// ===========================================================================
// STT, TTS, and VAD higher-level lifecycle events are all consolidated into a
// single `VoiceLifecycleEvent` message discriminated by `VoiceEventKind`
// (which carries TRANSCRIPTION_* / STT_* for STT, SYNTHESIS_* / AUDIO_GENERATED
// / PLAYBACK_* for TTS, VAD_* / SPEECH_* for VAD, plus voice-session
// orchestration). The low-level streaming pipeline payloads live in
// voice_events.proto's `VoiceEvent` (exposed via SDKEvent.voice_pipeline).
// ---------------------------------------------------------------------------

// ---------------------------------------------------------------------------
// Voice / audio higher-level events. Mirrors RN
//   events.ts:136-187 (SDKVoiceEvent: 41 variants).
// Plus Dart SDKVoiceEvent (~15 concrete classes), Kotlin STTEvent + TTSEvent.
//
// Renamed from `VoiceEvent` to `VoiceLifecycleEvent` to avoid colliding with
// `runanywhere.v1.VoiceEvent` from voice_events.proto, which carries the
// low-level streaming pipeline payloads (UserSaid / AssistantToken /
// AudioFrame / VAD / Interrupted / StateChange / Error / Metrics). The
// pipeline events are exposed via SDKEvent.voice_pipeline; this message
// is exposed via SDKEvent.voice.
// ---------------------------------------------------------------------------
message VoiceLifecycleEvent {
    VoiceEventKind kind            = 1;

    // For listeningStarted / voiceSession_* — optional session id.
    string         session_id      = 2;

    // For TRANSCRIPTION_PARTIAL / TRANSCRIPTION_FINAL / STT_PARTIAL_RESULT /
    // STT_COMPLETED.
    string         text            = 3;
    float          confidence      = 4;

    // For RESPONSE_GENERATED.
    string         response_text   = 5;

    // For AUDIO_GENERATED — base64-encoded PCM (RN events.ts:145).
    string         audio_base64    = 6;

    // For RECORDING_STOPPED / PLAYBACK_STARTED / PLAYBACK_COMPLETED —
    // duration in milliseconds (RN events.ts:158, 160-161).
    int64          duration_ms     = 7;

    // For VOICE_SESSION_LISTENING — current audio level (RN events.ts:178).
    float          audio_level     = 8;

    // VOICE_SESSION_TRANSCRIBED / VOICE_SESSION_RESPONDED /
    // VOICE_SESSION_TURN_COMPLETED reuse `text` (3) and `response_text` (5).
    reserved 9, 10, 11;  // were transcription / turn_response / turn_audio_base64

    // For *_ERROR / *_FAILED.
    string         error           = 12;

    // -----------------------------------------------------------------------
    // Telemetry metrics (STT transcription + TTS synthesis + model load) so
    // the C++ destination router derives the full telemetry payload from the
    // proto SDKEvent alone. Populated per-component (component on the SDKEvent
    // envelope selects which subset applies).
    // -----------------------------------------------------------------------
    string              model_id                 = 13;
    string              model_name               = 14;
    int64               input_audio_duration_ms  = 15;   // STT input audio
    int64               input_audio_bytes        = 16;
    int32               word_count               = 17;   // STT
    double              real_time_factor         = 18;   // STT
    string              language                 = 19;   // STT
    int32               sample_rate              = 20;   // STT + TTS
    bool                is_streaming             = 21;   // STT
    InferenceFramework  framework                = 22;

    // TTS synthesis metrics.
    int32               character_count          = 23;
    int64               output_audio_duration_ms = 24;   // TTS output audio
    int64               output_audio_bytes       = 25;
    int64               processing_duration_ms   = 26;   // telemetry processing_time_ms
    // The TTS counterpart to real_time_factor (18). rac_telemetry_tts_payload_t
    // has carried this field all along; without a home on the wire the value
    // emit_tts_synthesis_completed was handed had nowhere to go.
    double              characters_per_second    = 27;   // TTS
}

enum VoiceEventKind {
    VOICE_EVENT_KIND_UNSPECIFIED                 = 0;

    // Listening / detection.
    VOICE_EVENT_KIND_LISTENING_STARTED           = 1;
    VOICE_EVENT_KIND_LISTENING_ENDED             = 2;
    reserved 3;  // was SPEECH_DETECTED, a duplicate of SPEECH_STARTED (21)

    // Transcription.
    VOICE_EVENT_KIND_TRANSCRIPTION_STARTED       = 4;
    VOICE_EVENT_KIND_TRANSCRIPTION_PARTIAL       = 5;
    VOICE_EVENT_KIND_TRANSCRIPTION_FINAL         = 6;

    // Response generation / synthesis.
    VOICE_EVENT_KIND_RESPONSE_GENERATED          = 7;
    VOICE_EVENT_KIND_SYNTHESIS_STARTED           = 8;
    VOICE_EVENT_KIND_AUDIO_GENERATED             = 9;
    VOICE_EVENT_KIND_SYNTHESIS_COMPLETED         = 10;
    VOICE_EVENT_KIND_SYNTHESIS_FAILED            = 11;   // Kotlin TTSEvent.SYNTHESIS_FAILED

    // Pipeline lifecycle (high-level orchestration).
    VOICE_EVENT_KIND_PIPELINE_STARTED            = 12;
    VOICE_EVENT_KIND_PIPELINE_COMPLETED          = 13;
    VOICE_EVENT_KIND_PIPELINE_ERROR              = 14;

    // VAD.
    VOICE_EVENT_KIND_VAD_STARTED                 = 15;
    VOICE_EVENT_KIND_VAD_DETECTED                = 16;
    VOICE_EVENT_KIND_VAD_ENDED                   = 17;
