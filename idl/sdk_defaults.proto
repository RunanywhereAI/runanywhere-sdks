// RunAnywhere IDL — the central default pool.
//
// These messages are not wire types; nothing sends a NetworkDefaults over the
// C ABI. They carry `rac_default` annotations that the convenience generators
// turn into per-language constants and that generate_cpp_defaults.py turns into
// C macros for commons.
//
// Values belonging to an existing option message stay there; sampling
// parameters live in llm_options.proto and vlm_options.proto. This file holds
// the platform-layer knobs that had no proto message and so were retyped per
// SDK: HTTP timeouts, audio capture rates, worker handshakes, retry policy.
//
// A message is named for who owns the value. WorkerDefaults is Web-only
// because no other platform has a worker handshake; FFIDefaults is read only by
// the SDKs that marshal C strings.
//
// Not every field below has a consumer yet. connect_timeout_ms,
// stream_chunk_bytes, and mic_tap_buffer_frames are declared here but still
// hardcoded at their call sites; wire them up or delete them.

syntax = "proto3";

package runanywhere.v1;

import "rac_options.proto";

option cc_enable_arenas      = true;
option java_multiple_files   = true;
option java_package          = "ai.runanywhere.proto.v1";
option java_outer_classname  = "SdkDefaultsProto";
option objc_class_prefix     = "RAV1";
option csharp_namespace      = "Runanywhere.V1";
option swift_prefix          = "RA";
option go_package            = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

message NetworkDefaults {
    // Per-request timeout for ordinary API calls.
    int32 request_timeout_ms     = 1 [
        (runanywhere.v1.rac_default) = "60000",
        (runanywhere.v1.rac_min) = 1000
    ];

    // Whole-resource ceiling for a non-streaming request, including retries.
    int32 resource_timeout_ms    = 2 [
        (runanywhere.v1.rac_default) = "600000",
        (runanywhere.v1.rac_min) = 1000
    ];

    // Streaming responses set no call timeout at all; this caps stalled reads.
    int32 streaming_timeout_ms   = 3 [
        (runanywhere.v1.rac_default) = "86400000",
        (runanywhere.v1.rac_min) = 1000
    ];

    // Used when a caller passes no per-request timeout. Deliberately tighter
    // than request_timeout_ms.
    int32 adapter_timeout_ms     = 4 [
        (runanywhere.v1.rac_default) = "30000",
        (runanywhere.v1.rac_min) = 1000
    ];

    int32 connect_timeout_ms     = 5 [
        (runanywhere.v1.rac_default) = "30000",
        (runanywhere.v1.rac_min) = 1000
    ];

    // Read buffer for copying a streaming body.
    int32 stream_chunk_bytes     = 6 [
        (runanywhere.v1.rac_default) = "262144",
        (runanywhere.v1.rac_min) = 1024
    ];

    // Only Web has a retry policy; declaring this does not switch it on
    // elsewhere.
    int32 max_retries            = 7 [
        (runanywhere.v1.rac_default) = "3",
        (runanywhere.v1.rac_min) = 0,
        (runanywhere.v1.rac_max) = 10
    ];

    // delay = base * 2^attempt
    int32 retry_backoff_base_ms  = 8 [
        (runanywhere.v1.rac_default) = "100",
        (runanywhere.v1.rac_min) = 1
    ];
}

message AudioCaptureDefaults {
    // STT and VAD both expect 16 kHz mono PCM16.
    int32 mic_sample_rate_hz     = 1 [
        (runanywhere.v1.rac_default) = "16000",
        (runanywhere.v1.rac_min) = 8000,
        (runanywhere.v1.rac_max) = 48000
    ];

    // Mono; the STT frontends downmix anyway.
    int32 mic_channels           = 2 [
        (runanywhere.v1.rac_default) = "1",
        (runanywhere.v1.rac_min) = 1,
        (runanywhere.v1.rac_max) = 2
    ];

    // Bounded queue between the capture callback and the consumer. Frames are
    // dropped rather than buffered without limit when full.
    int32 mic_channel_capacity   = 3 [
        (runanywhere.v1.rac_default) = "128",
        (runanywhere.v1.rac_min) = 1
    ];

    int32 mic_tap_buffer_frames  = 4 [
        (runanywhere.v1.rac_default) = "4096",
        (runanywhere.v1.rac_min) = 256
    ];

    // Assumed when a TTS backend reports no rate.
    int32 tts_sample_rate_hz     = 5 [
        (runanywhere.v1.rac_default) = "22050",
        (runanywhere.v1.rac_min) = 8000,
        (runanywhere.v1.rac_max) = 48000
    ];
}

message VoiceAgentDefaults {
    // Short on purpose: a voice reply that runs long is worse than one that
    // gets cut off.
    int32 max_tokens               = 1 [
        (runanywhere.v1.rac_default) = "96",
        (runanywhere.v1.rac_min) = 1
    ];

    // Greedy. Voice turns favor predictability over variety.
    float temperature              = 2 [
        (runanywhere.v1.rac_default) = "0.0",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 2.0
    ];

    // Loaded when a voice session starts with no VAD model current.
    string default_vad_model_id    = 3 [
        (runanywhere.v1.rac_default) = "silero-vad"
    ];

    // RMS energy above which a frame counts as speech, and the initial noise
    // floor estimate.
    float speech_rms_threshold     = 4 [
        (runanywhere.v1.rac_default) = "0.015",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 1.0
    ];

    // threshold = noise_floor * multiplier
    float speech_floor_multiplier  = 5 [
        (runanywhere.v1.rac_default) = "2.0",
        (runanywhere.v1.rac_min_float) = 1.5,
        (runanywhere.v1.rac_max_float) = 4.0
    ];
}

message HybridDefaults {
    // On-device STT confidence below which the router cascades to cloud.
    float stt_confidence_threshold = 1 [
        (runanywhere.v1.rac_default) = "0.5",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 1.0
    ];
}

// Web-only: no other SDK runs backends in a worker.
message WorkerDefaults {
    int32 handshake_timeout_ms      = 1 [
        (runanywhere.v1.rac_default) = "10000",
        (runanywhere.v1.rac_min) = 100
    ];

    // Much larger than the handshake: a cold WASM compile is slow.
    int32 backend_init_timeout_ms   = 2 [
        (runanywhere.v1.rac_default) = "120000",
        (runanywhere.v1.rac_min) = 1000
    ];
}

message FFIDefaults {
    // Scratch buffer for a filesystem path returned by the C ABI.
    int32 path_buffer_bytes         = 1 [
        (runanywhere.v1.rac_default) = "1024",
        (runanywhere.v1.rac_min) = 256
    ];
}

// Swift and Kotlin require the caller to pass a base URL and fall back only to
// the development placeholder; Flutter and React Native default to production.
// Consolidating the strings here does not settle which behavior is right.
message EnvironmentDefaults {
    string production_base_url    = 1 [
        (runanywhere.v1.rac_default) = "https://api.runanywhere.ai"
    ];

    string development_base_url   = 2 [
        (runanywhere.v1.rac_default) = "https://dev-api.runanywhere.ai"
    ];

    // Deliberately unroutable, so an unconfigured build fails visibly rather
    // than talking to production.
    string development_placeholder_url = 3 [
        (runanywhere.v1.rac_default) = "https://dev.runanywhere.local"
    ];
}

// Separate from LLMGenerationOptions on purpose: a schema-constrained call
// wants deterministic decoding and room to close the JSON.
message StructuredOutputDefaults {
    int32 max_tokens  = 1 [
        (runanywhere.v1.rac_default) = "512",
        (runanywhere.v1.rac_min) = 1
    ];

    // Greedy: a schema-constrained result should not vary between calls.
    float temperature = 2 [
        (runanywhere.v1.rac_default) = "0.0",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 2.0
    ];
}

message StorageDefaults {
    // Assumed when computing a model's memory footprint and the artifact
    // reports no context length.
    int32 context_length            = 1 [
        (runanywhere.v1.rac_default) = "2048",
        (runanywhere.v1.rac_min) = 1
    ];
}
