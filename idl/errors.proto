// RunAnywhere IDL — error types (codes, categories, structured errors).
//
// Canonical numeric values come from
// sdk/runanywhere-commons/include/rac/core/rac_error.h. Changing a value is a
// wire break across every SDK; adding one is safe.

syntax = "proto3";

package runanywhere.v1;

import "rac_options.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "ErrorsProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// Coarse routing bucket. Per-modality errors (STT, TTS, LLM, VAD, VLM) fold
// into COMPONENT; use SDKError.component to tell them apart.
//
// The rac_wire_string values are the one form every SDK prints, so a crash
// report written by Swift and one written by Web say the same word.
enum ErrorCategory {
    ERROR_CATEGORY_UNSPECIFIED   = 0 [(runanywhere.v1.rac_wire_string) = "unspecified"];
    ERROR_CATEGORY_NETWORK       = 1 [(runanywhere.v1.rac_wire_string) = "network_error"];          // wire, HTTP, download, server, timeout
    ERROR_CATEGORY_VALIDATION    = 2 [(runanywhere.v1.rac_wire_string) = "invalid_request_error"];  // invalid args, empty input, format
    ERROR_CATEGORY_MODEL         = 3 [(runanywhere.v1.rac_wire_string) = "model_error"];            // not-found, load-failed, incompatible
    ERROR_CATEGORY_COMPONENT     = 4 [(runanywhere.v1.rac_wire_string) = "component_error"];        // STT/TTS/LLM/VAD/VLM/etc. lifecycle
    ERROR_CATEGORY_IO            = 5 [(runanywhere.v1.rac_wire_string) = "io_error"];               // file system, storage, audio buffers
    ERROR_CATEGORY_AUTH          = 6 [(runanywhere.v1.rac_wire_string) = "authentication_error"];   // API key, unauthorized, forbidden
    ERROR_CATEGORY_INTERNAL      = 7 [(runanywhere.v1.rac_wire_string) = "internal_error"];         // unknown, not-implemented, internal
    ERROR_CATEGORY_CONFIGURATION = 8 [(runanywhere.v1.rac_wire_string) = "configuration_error"];    // env mismatch, init not done, bad cfg
}

enum ErrorSeverity {
    ERROR_SEVERITY_UNSPECIFIED = 0;
    ERROR_SEVERITY_DEBUG       = 1;
    ERROR_SEVERITY_INFO        = 2;
    ERROR_SEVERITY_WARNING     = 3;
    ERROR_SEVERITY_ERROR       = 4;
    ERROR_SEVERITY_CRITICAL    = 5;
}

// proto3 forbids negative enum values, so each constant is the absolute
// magnitude of its C ABI code: ERROR_CODE_<NAME> = abs(RAC_ERROR_<NAME>).
// SDKError.c_abi_code carries the signed original.
//
// The trailing macro names below are kept because they are the cross-reference
// into rac_error.h; where the C ABI defines two names for one value, the alias
// is noted.
enum ErrorCode {
    ERROR_CODE_UNSPECIFIED                = 0;

    // -- Initialization (-100..-109) -----------------------------------------
    ERROR_CODE_NOT_INITIALIZED            = 100;  // RAC_ERROR_NOT_INITIALIZED
    ERROR_CODE_ALREADY_INITIALIZED        = 101;  // RAC_ERROR_ALREADY_INITIALIZED
    ERROR_CODE_INITIALIZATION_FAILED      = 102;  // RAC_ERROR_INITIALIZATION_FAILED
    ERROR_CODE_INVALID_CONFIGURATION      = 103;  // RAC_ERROR_INVALID_CONFIGURATION
    ERROR_CODE_INVALID_API_KEY            = 104;  // RAC_ERROR_INVALID_API_KEY
    ERROR_CODE_ENVIRONMENT_MISMATCH       = 105;  // RAC_ERROR_ENVIRONMENT_MISMATCH
    ERROR_CODE_INVALID_PARAMETER          = 106;  // RAC_ERROR_INVALID_PARAMETER

    // -- Model (-110..-129) --------------------------------------------------
    ERROR_CODE_MODEL_NOT_FOUND            = 110;  // RAC_ERROR_MODEL_NOT_FOUND
    ERROR_CODE_MODEL_LOAD_FAILED          = 111;  // RAC_ERROR_MODEL_LOAD_FAILED
    ERROR_CODE_MODEL_VALIDATION_FAILED    = 112;  // RAC_ERROR_MODEL_VALIDATION_FAILED
    ERROR_CODE_MODEL_INCOMPATIBLE         = 113;  // RAC_ERROR_MODEL_INCOMPATIBLE
    ERROR_CODE_INVALID_MODEL_FORMAT       = 114;  // RAC_ERROR_INVALID_MODEL_FORMAT
    ERROR_CODE_MODEL_STORAGE_CORRUPTED    = 115;  // RAC_ERROR_MODEL_STORAGE_CORRUPTED
    ERROR_CODE_MODEL_NOT_LOADED           = 116;  // RAC_ERROR_MODEL_NOT_LOADED

    // -- Generation (-130..-149) --------------------------------------------
    ERROR_CODE_GENERATION_FAILED          = 130;  // RAC_ERROR_GENERATION_FAILED
    ERROR_CODE_GENERATION_TIMEOUT         = 131;  // RAC_ERROR_GENERATION_TIMEOUT
    ERROR_CODE_CONTEXT_TOO_LONG           = 132;  // RAC_ERROR_CONTEXT_TOO_LONG
    ERROR_CODE_TOKEN_LIMIT_EXCEEDED       = 133;  // RAC_ERROR_TOKEN_LIMIT_EXCEEDED
    ERROR_CODE_COST_LIMIT_EXCEEDED        = 134;  // RAC_ERROR_COST_LIMIT_EXCEEDED
    ERROR_CODE_INFERENCE_FAILED           = 135;  // RAC_ERROR_INFERENCE_FAILED
    ERROR_CODE_GENERATION_CANCELLED       = 136;  // RAC_ERROR_GENERATION_CANCELLED

    // -- Network (-150..-179) ------------------------------------------------
    ERROR_CODE_NETWORK_UNAVAILABLE        = 150;  // RAC_ERROR_NETWORK_UNAVAILABLE
    ERROR_CODE_NETWORK_ERROR              = 151;  // RAC_ERROR_NETWORK_ERROR
    ERROR_CODE_REQUEST_FAILED             = 152;  // RAC_ERROR_REQUEST_FAILED
    ERROR_CODE_DOWNLOAD_FAILED            = 153;  // RAC_ERROR_DOWNLOAD_FAILED
    ERROR_CODE_SERVER_ERROR               = 154;  // RAC_ERROR_SERVER_ERROR
    ERROR_CODE_TIMEOUT                    = 155;  // RAC_ERROR_TIMEOUT
    ERROR_CODE_INVALID_RESPONSE           = 156;  // RAC_ERROR_INVALID_RESPONSE
    ERROR_CODE_HTTP_ERROR                 = 157;  // RAC_ERROR_HTTP_ERROR
    ERROR_CODE_CONNECTION_LOST            = 158;  // RAC_ERROR_CONNECTION_LOST
    ERROR_CODE_PARTIAL_DOWNLOAD           = 159;  // RAC_ERROR_PARTIAL_DOWNLOAD
    ERROR_CODE_HTTP_REQUEST_FAILED        = 160;  // RAC_ERROR_HTTP_REQUEST_FAILED
    ERROR_CODE_HTTP_NOT_SUPPORTED         = 161;  // RAC_ERROR_HTTP_NOT_SUPPORTED

    // -- Storage (-180..-219) ------------------------------------------------
    ERROR_CODE_INSUFFICIENT_STORAGE       = 180;  // RAC_ERROR_INSUFFICIENT_STORAGE
    ERROR_CODE_STORAGE_FULL               = 181;  // RAC_ERROR_STORAGE_FULL
    ERROR_CODE_STORAGE_ERROR              = 182;  // RAC_ERROR_STORAGE_ERROR
    ERROR_CODE_FILE_NOT_FOUND             = 183;  // RAC_ERROR_FILE_NOT_FOUND
    ERROR_CODE_FILE_READ_FAILED           = 184;  // RAC_ERROR_FILE_READ_FAILED
    ERROR_CODE_FILE_WRITE_FAILED          = 185;  // RAC_ERROR_FILE_WRITE_FAILED
    ERROR_CODE_PERMISSION_DENIED          = 186;  // RAC_ERROR_PERMISSION_DENIED
    ERROR_CODE_DELETE_FAILED              = 187;  // RAC_ERROR_DELETE_FAILED (alias: RAC_ERROR_FILE_DELETE_FAILED)
    ERROR_CODE_MOVE_FAILED                = 188;  // RAC_ERROR_MOVE_FAILED
    ERROR_CODE_DIRECTORY_CREATION_FAILED  = 189;  // RAC_ERROR_DIRECTORY_CREATION_FAILED
    ERROR_CODE_DIRECTORY_NOT_FOUND        = 190;  // RAC_ERROR_DIRECTORY_NOT_FOUND
    ERROR_CODE_INVALID_PATH               = 191;  // RAC_ERROR_INVALID_PATH
    ERROR_CODE_INVALID_FILE_NAME          = 192;  // RAC_ERROR_INVALID_FILE_NAME
    ERROR_CODE_TEMP_FILE_CREATION_FAILED  = 193;  // RAC_ERROR_TEMP_FILE_CREATION_FAILED

    // -- Hardware (-220..-229) -----------------------------------------------
    ERROR_CODE_HARDWARE_UNSUPPORTED       = 220;  // RAC_ERROR_HARDWARE_UNSUPPORTED
    ERROR_CODE_INSUFFICIENT_MEMORY        = 221;  // RAC_ERROR_INSUFFICIENT_MEMORY (alias: RAC_ERROR_OUT_OF_MEMORY)

    // -- Component state (-230..-249) ---------------------------------------
    ERROR_CODE_COMPONENT_NOT_READY        = 230;  // RAC_ERROR_COMPONENT_NOT_READY
    ERROR_CODE_INVALID_STATE              = 231;  // RAC_ERROR_INVALID_STATE
    ERROR_CODE_SERVICE_NOT_AVAILABLE      = 232;  // RAC_ERROR_SERVICE_NOT_AVAILABLE
    ERROR_CODE_SERVICE_BUSY               = 233;  // RAC_ERROR_SERVICE_BUSY
    ERROR_CODE_PROCESSING_FAILED          = 234;  // RAC_ERROR_PROCESSING_FAILED
    ERROR_CODE_START_FAILED               = 235;  // RAC_ERROR_START_FAILED
    ERROR_CODE_NOT_SUPPORTED              = 236;  // RAC_ERROR_NOT_SUPPORTED

    // -- Validation (-250..-279) --------------------------------------------
    ERROR_CODE_VALIDATION_FAILED          = 250;  // RAC_ERROR_VALIDATION_FAILED
    ERROR_CODE_INVALID_INPUT              = 251;  // RAC_ERROR_INVALID_INPUT
    ERROR_CODE_INVALID_FORMAT             = 252;  // RAC_ERROR_INVALID_FORMAT
    ERROR_CODE_EMPTY_INPUT                = 253;  // RAC_ERROR_EMPTY_INPUT
    ERROR_CODE_TEXT_TOO_LONG              = 254;  // RAC_ERROR_TEXT_TOO_LONG
    ERROR_CODE_INVALID_SSML               = 255;  // RAC_ERROR_INVALID_SSML
    ERROR_CODE_INVALID_SPEAKING_RATE      = 256;  // RAC_ERROR_INVALID_SPEAKING_RATE
    ERROR_CODE_INVALID_PITCH              = 257;  // RAC_ERROR_INVALID_PITCH
    ERROR_CODE_INVALID_VOLUME             = 258;  // RAC_ERROR_INVALID_VOLUME
    ERROR_CODE_INVALID_ARGUMENT           = 259;  // RAC_ERROR_INVALID_ARGUMENT
    ERROR_CODE_NULL_POINTER               = 260;  // RAC_ERROR_NULL_POINTER
    ERROR_CODE_BUFFER_TOO_SMALL           = 261;  // RAC_ERROR_BUFFER_TOO_SMALL
    ERROR_CODE_OUTPUT_TRUNCATED           = 262;  // RAC_ERROR_OUTPUT_TRUNCATED

    // -- Audio (-280..-299) -------------------------------------------------
    ERROR_CODE_AUDIO_FORMAT_NOT_SUPPORTED       = 280;  // RAC_ERROR_AUDIO_FORMAT_NOT_SUPPORTED
    ERROR_CODE_AUDIO_SESSION_FAILED             = 281;  // RAC_ERROR_AUDIO_SESSION_FAILED
    ERROR_CODE_MICROPHONE_PERMISSION_DENIED     = 282;  // RAC_ERROR_MICROPHONE_PERMISSION_DENIED
    ERROR_CODE_INSUFFICIENT_AUDIO_DATA          = 283;  // RAC_ERROR_INSUFFICIENT_AUDIO_DATA
    ERROR_CODE_EMPTY_AUDIO_BUFFER               = 284;  // RAC_ERROR_EMPTY_AUDIO_BUFFER
    ERROR_CODE_AUDIO_SESSION_ACTIVATION_FAILED  = 285;  // RAC_ERROR_AUDIO_SESSION_ACTIVATION_FAILED

    // -- Language / voice (-300..-319) --------------------------------------
    ERROR_CODE_LANGUAGE_NOT_SUPPORTED     = 300;  // RAC_ERROR_LANGUAGE_NOT_SUPPORTED
    ERROR_CODE_VOICE_NOT_AVAILABLE        = 301;  // RAC_ERROR_VOICE_NOT_AVAILABLE
    ERROR_CODE_STREAMING_NOT_SUPPORTED    = 302;  // RAC_ERROR_STREAMING_NOT_SUPPORTED
    ERROR_CODE_STREAM_CANCELLED           = 303;  // RAC_ERROR_STREAM_CANCELLED

    // -- Authentication (-320..-329) ----------------------------------------
    ERROR_CODE_AUTHENTICATION_FAILED      = 320;  // RAC_ERROR_AUTHENTICATION_FAILED
    ERROR_CODE_UNAUTHORIZED               = 321;  // RAC_ERROR_UNAUTHORIZED
    ERROR_CODE_FORBIDDEN                  = 322;  // RAC_ERROR_FORBIDDEN

    // -- Security (-330..-349) ----------------------------------------------
    ERROR_CODE_KEYCHAIN_ERROR             = 330;  // RAC_ERROR_KEYCHAIN_ERROR
    ERROR_CODE_ENCODING_ERROR             = 331;  // RAC_ERROR_ENCODING_ERROR
    ERROR_CODE_DECODING_ERROR             = 332;  // RAC_ERROR_DECODING_ERROR
    ERROR_CODE_SECURE_STORAGE_FAILED      = 333;  // RAC_ERROR_SECURE_STORAGE_FAILED

    // -- Extraction (-350..-369) --------------------------------------------
    ERROR_CODE_EXTRACTION_FAILED          = 350;  // RAC_ERROR_EXTRACTION_FAILED
    ERROR_CODE_CHECKSUM_MISMATCH          = 351;  // RAC_ERROR_CHECKSUM_MISMATCH
    ERROR_CODE_UNSUPPORTED_ARCHIVE        = 352;  // RAC_ERROR_UNSUPPORTED_ARCHIVE

    // -- Calibration (-370..-379) -------------------------------------------
    ERROR_CODE_CALIBRATION_FAILED         = 370;  // RAC_ERROR_CALIBRATION_FAILED
    ERROR_CODE_CALIBRATION_TIMEOUT        = 371;  // RAC_ERROR_CALIBRATION_TIMEOUT

    // -- Cancellation (-380..-389) ------------------------------------------
    ERROR_CODE_CANCELLED                  = 380;  // RAC_ERROR_CANCELLED

    // -- Module / service (-400..-499) --------------------------------------
    ERROR_CODE_MODULE_NOT_FOUND           = 400;  // RAC_ERROR_MODULE_NOT_FOUND
    ERROR_CODE_MODULE_ALREADY_REGISTERED  = 401;  // RAC_ERROR_MODULE_ALREADY_REGISTERED
    ERROR_CODE_MODULE_LOAD_FAILED         = 402;  // RAC_ERROR_MODULE_LOAD_FAILED
    ERROR_CODE_SERVICE_NOT_FOUND          = 410;  // RAC_ERROR_SERVICE_NOT_FOUND
    ERROR_CODE_SERVICE_ALREADY_REGISTERED = 411;  // RAC_ERROR_SERVICE_ALREADY_REGISTERED
    ERROR_CODE_SERVICE_CREATE_FAILED      = 412;  // RAC_ERROR_SERVICE_CREATE_FAILED
    ERROR_CODE_CAPABILITY_NOT_FOUND       = 420;  // RAC_ERROR_CAPABILITY_NOT_FOUND
    ERROR_CODE_PROVIDER_NOT_FOUND         = 421;  // RAC_ERROR_PROVIDER_NOT_FOUND
    ERROR_CODE_NO_CAPABLE_PROVIDER        = 422;  // RAC_ERROR_NO_CAPABLE_PROVIDER
    ERROR_CODE_NOT_FOUND                  = 423;  // RAC_ERROR_NOT_FOUND

    // -- Platform adapter (-500..-599) --------------------------------------
    ERROR_CODE_ADAPTER_NOT_SET            = 500;  // RAC_ERROR_ADAPTER_NOT_SET

    // -- Backend (-600..-699) -----------------------------------------------
    ERROR_CODE_BACKEND_NOT_FOUND          = 600;  // RAC_ERROR_BACKEND_NOT_FOUND
    ERROR_CODE_BACKEND_NOT_READY          = 601;  // RAC_ERROR_BACKEND_NOT_READY
    ERROR_CODE_BACKEND_INIT_FAILED        = 602;  // RAC_ERROR_BACKEND_INIT_FAILED
    ERROR_CODE_BACKEND_BUSY               = 603;  // RAC_ERROR_BACKEND_BUSY
    ERROR_CODE_BACKEND_UNAVAILABLE        = 604;  // RAC_ERROR_BACKEND_UNAVAILABLE
    ERROR_CODE_RUNTIME_UNAVAILABLE        = 605;  // RAC_ERROR_RUNTIME_UNAVAILABLE
    ERROR_CODE_BACKEND_ERROR              = 606;  // RAC_ERROR_BACKEND_ERROR (generic backend failure)
    ERROR_CODE_INVALID_HANDLE             = 610;  // RAC_ERROR_INVALID_HANDLE

    // -- Event (-700..-799) -------------------------------------------------
    ERROR_CODE_EVENT_INVALID_CATEGORY     = 700;  // RAC_ERROR_EVENT_INVALID_CATEGORY
    ERROR_CODE_EVENT_SUBSCRIPTION_FAILED  = 701;  // RAC_ERROR_EVENT_SUBSCRIPTION_FAILED
    ERROR_CODE_EVENT_PUBLISH_FAILED       = 702;  // RAC_ERROR_EVENT_PUBLISH_FAILED

    // -- Other (-800..-899) -------------------------------------------------
    ERROR_CODE_NOT_IMPLEMENTED            = 800;  // RAC_ERROR_NOT_IMPLEMENTED
    ERROR_CODE_FEATURE_NOT_AVAILABLE      = 801;  // RAC_ERROR_FEATURE_NOT_AVAILABLE
    ERROR_CODE_FRAMEWORK_NOT_AVAILABLE    = 802;  // RAC_ERROR_FRAMEWORK_NOT_AVAILABLE
    ERROR_CODE_UNSUPPORTED_MODALITY       = 803;  // RAC_ERROR_UNSUPPORTED_MODALITY
    ERROR_CODE_UNKNOWN                    = 804;  // RAC_ERROR_UNKNOWN
    ERROR_CODE_INTERNAL                   = 805;  // RAC_ERROR_INTERNAL

    // -- Plugin (-810..-829) ------------------------------------------------
    ERROR_CODE_ABI_VERSION_MISMATCH       = 810;  // RAC_ERROR_ABI_VERSION_MISMATCH
    ERROR_CODE_CAPABILITY_UNSUPPORTED     = 811;  // RAC_ERROR_CAPABILITY_UNSUPPORTED
    ERROR_CODE_PLUGIN_DUPLICATE           = 812;  // RAC_ERROR_PLUGIN_DUPLICATE
    ERROR_CODE_PLUGIN_LOAD_FAILED         = 820;  // RAC_ERROR_PLUGIN_LOAD_FAILED
    ERROR_CODE_PLUGIN_BUSY                = 821;  // RAC_ERROR_PLUGIN_BUSY

    // -- Web-only WASM codes (-900..-903) -----------------------------------
    // The C ABI reserves -900..-999 for future use. The Web SDK currently
    // squats four codes here for WASM bridge failures; codegen tags these
    // as platform=web only. They are preserved verbatim so existing Web
    // consumers don't break, but new SDKs SHOULD NOT emit them.
    // Source: sdk/runanywhere-web/packages/core/src/Foundation/ErrorTypes.ts:58
    ERROR_CODE_WASM_LOAD_FAILED           = 900;
    ERROR_CODE_WASM_NOT_LOADED            = 901;
    ERROR_CODE_WASM_CALLBACK_ERROR        = 902;
    ERROR_CODE_WASM_MEMORY_ERROR          = 903;
}

// The unified error payload every SDK throws or returns.
//
// `code` is always non-zero: an SDKError implies failure, and success is
// signalled by its absence. `message` is non-localized; localization is a
// consumer concern. Stack traces are deliberately absent: they are
// platform-shaped and belong in platform-local logging.
message SDKError {
    ErrorCode             code           = 1;
    ErrorCategory         category       = 2;
    string                message        = 3;

    // Signed rac_result_t. Equals -code for codes <= 899. Unset for the
    // Web-only WASM codes (>= 900), which have no C ABI counterpart, and for
    // failures originating outside the C ABI.
    optional int32        c_abi_code     = 4;

    // The "caused by" chain.
    optional string       nested_message = 5;

    int64                 timestamp_ms   = 6;
    ErrorSeverity         severity       = 7;

    // Which subsystem raised the error, written as SDKComponent's
    // rac_wire_string ("llm", "stt", "rag", "rerank"). Producers MUST write
    // the wire string, never the proto constant name. Errors raised outside
    // any SDKComponent may carry their own lowercase key.
    string                component      = 8;

    bool                  retryable      = 9;

    // Ties this failure to the operation that produced it. Named for
    // Anthropic's body-level `request_id`. Producers MUST set it.
    string                request_id     = 10;

    // "<Message>.<field>" for validation errors, e.g. "STTOptions.sampleRate".
    // OpenAI's `param`. The generated validate() emits this.
    optional string       param          = 11;
}
