// RunAnywhere IDL — TTS configuration, options, output, and metadata.
//
// All durations are int64 milliseconds. SDKs that expose seconds convert at
// the binding layer. audio_data is opaque bytes; each SDK adapts it to its
// native buffer type.

syntax = "proto3";

package runanywhere.v1;

import "errors.proto";
import "model_types.proto";
import "rac_options.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "TtsOptionsProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

message TTSOptions {
    // Empty = use the component's configured voice.
    string             voice               = 1;

    // Voice/model id to synthesize with. Unset = use whatever is already
    // loaded for MODEL_CATEGORY_SPEECH_SYNTHESIS; set = load it first,
    // downloading if needed.
    optional string    model               = 13;

    // BCP-47. Empty = use the component default.
    string             language_code       = 2 [(runanywhere.v1.rac_default) = "en-US"];

    // Speed multiplier, matching OpenAI /audio/speech `speed`.
    float              speed               = 3 [
        (runanywhere.v1.rac_default) = "1.0",
        (runanywhere.v1.rac_min_float) = 0.5,
        (runanywhere.v1.rac_max_float) = 2.0
    ];

    // Fundamental-frequency multiplier, 1.0 = the voice's own pitch. Honoured
    // only by the platform backend (Apple System TTS / Android TextToSpeech);
    // neural voices (sherpa/Piper/Kokoro, qhexrt) ignore it, because for them
    // pitch is voice identity rather than a dial.
    float              pitch               = 4 [
        (runanywhere.v1.rac_default) = "1.0",
        (runanywhere.v1.rac_min_float) = 0.5,
        (runanywhere.v1.rac_max_float) = 2.0
    ];

    // 0.0 - 1.0.
    float              volume              = 5 [(runanywhere.v1.rac_default) = "1.0"];

    reserved 6;                  // was enable_ssml -- no backend parses SSML
    reserved "enable_ssml";

    // TTS honours exactly AUDIO_FORMAT_PCM (float32) and AUDIO_FORMAT_WAV.
    // Other values, including AUDIO_FORMAT_PCM_S16LE, fall through to PCM
    // silently today; do not rely on them until that is fixed.
    runanywhere.v1.AudioFormat audio_format = 7 [(runanywhere.v1.rac_default) = "AUDIO_FORMAT_PCM"];

    // 0 (the default) = render at the voice's native rate. Naming any other
    // rate forces a resample and costs quality. TTSOutput.sample_rate always
    // reports the rate actually used.
    int32              sample_rate         = 8 [(runanywhere.v1.rac_default) = "0"];

    reserved 9, 10, 11;          // was speaker_id, style; 10 never used
    reserved "speaker_id", "style";
}

// TTSConfiguration deleted. It was write-only: engine pinning already
// resolves off ModelLoadRequest, and "which voice" is TTSOptions.model.

message TTSSynthesisRequest {
    string request_id = 1;
    string text = 2;
    reserved 3;                  // was ssml -- engines spoke the markup aloud
    reserved "ssml";
    optional TTSOptions options = 4;
    reserved 5;                  // was metadata -- no code ever read it
    reserved "metadata";
}

// TTSPhonemeTimestamp deleted -- never produced, and the wrong granularity.
// If timings are wanted later, add a request-side `timestamps` enum
// {none, word, character} plus repeated TTSTimestamp {text, start_ms, end_ms}.

message TTSSynthesisMetadata {
    string voice_id            = 1;

    // BCP-47.
    string language_code       = 2;

    int64  processing_time_ms  = 3;

    // UTF-8 byte length of the spoken input, not a codepoint count.
    int32  input_bytes         = 4;

    reserved 5;                  // was audio_duration_ms -- == parent duration_ms
    reserved "audio_duration_ms";
}

message TTSOutput {
    // Encoded per audio_format.
    bytes                          audio_data          = 1;
    runanywhere.v1.AudioFormat     audio_format        = 2;

    // Required to interpret PCM payloads. For compressed formats this is the
    // synthesis rate, not the container rate.
    int32                          sample_rate         = 3;

    int64                          duration_ms         = 4;

    reserved 5;                  // was phoneme_timestamps -- never produced
    reserved "phoneme_timestamps";

    TTSSynthesisMetadata           metadata            = 6;

    // Milliseconds since epoch.
    int64                          timestamp_ms        = 7;

    // For one-shot synthesis, chunk_index=0 and is_final=true.
    int32                          chunk_index         = 8;
    bool                           is_final            = 9;

    reserved 10;                 // was audio_size_bytes -- == audio_data.size()
    reserved "audio_size_bytes";

    optional SDKError              error               = 13;
}

// Metadata-only view for callers that let the SDK play the audio and never
// need the raw bytes.
message TTSSpeakResult {
    runanywhere.v1.AudioFormat     audio_format        = 1;
    int32                          sample_rate         = 2;
    int64                          duration_ms         = 3;

    // 0 for system TTS that plays directly without exposing buffers.
    int64                          audio_size_bytes    = 4;

    TTSSynthesisMetadata           metadata            = 5;

    // Milliseconds since epoch, when speech completed.
    int64                          timestamp_ms        = 6;

    optional SDKError               error               = 9;
}

message TTSVoiceInfo {
    // Passed back as TTSOptions.voice.
    string         id            = 1;

    // e.g. "Samantha". MUST NOT be a copy of `id` -- fall back to the model
    // id only when the engine reports no display name.
    string         display_name  = 2;

    // BCP-47.
    string         language_code = 3;

    // The voice's native rate in Hz -- tells the caller whether naming a
    // different TTSOptions.sample_rate buys anything.
    int32          sample_rate   = 8;

    reserved 4, 5, 6, 7, 9;
    reserved "gender", "description", "is_neural", "is_system",
             "supported_styles";
}
// enum TTSVoiceGender deleted -- its only field is gone.

message TTSVoiceList {
    repeated TTSVoiceInfo voices = 1;
}

enum TTSStreamEventKind {
    TTS_STREAM_EVENT_KIND_UNSPECIFIED = 0;
    TTS_STREAM_EVENT_KIND_STARTED = 1;
    TTS_STREAM_EVENT_KIND_AUDIO_CHUNK = 2;
    TTS_STREAM_EVENT_KIND_COMPLETED = 4;
    TTS_STREAM_EVENT_KIND_ERROR = 5;
    reserved 3, 6;               // was PHONEME, PROGRESS -- nothing emitted either
    reserved "TTS_STREAM_EVENT_KIND_PHONEME", "TTS_STREAM_EVENT_KIND_PROGRESS";
}

message TTSStreamEvent {
    int64 timestamp_us = 2;
    string request_id = 3;
    TTSStreamEventKind kind = 4;
    optional TTSOutput output = 5;
    optional SDKError error = 15;

    // Chunk ordering lives on TTSOutput.chunk_index, which is populated.
    reserved 1, 6, 7, 10, 11, 12, 13, 14;
    reserved "phoneme", "speak_result", "progress", "chunk_index",
             "total_chunks", "elapsed_ms", "status_message";
}

message TTSServiceState {
    bool is_ready = 1;
    optional string current_voice = 2;
    reserved 3;                  // was voices -- use the list-voices verb
    reserved "voices";
    repeated string supported_language_codes = 4;
    optional SDKError error = 7;
}
