// RunAnywhere IDL — hybrid on-device / cloud routing.
//
// Only STT is wired today. Most of these types are consumed by the TypeScript
// and Dart routing policy rather than by commons.

syntax = "proto3";

package runanywhere.v1;

import "model_types.proto";
import "rac_options.proto";

option cc_enable_arenas      = true;
option java_multiple_files   = true;
option java_package          = "ai.runanywhere.proto.v1";
option java_outer_classname  = "HybridRouterProto";
option objc_class_prefix     = "RAV1";
option csharp_namespace      = "Runanywhere.V1";
option swift_prefix          = "RA";
option go_package            = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

// Firebase AI Logic / developer.android.com InferenceMode, verbatim.
// PREFER_* falls back silently across the boundary; ONLY_* fails instead.
enum HybridInferenceMode {
    // Treated as PREFER_ON_DEVICE, so the proto3 zero is the private default.
    HYBRID_INFERENCE_MODE_UNSPECIFIED      = 0;
    HYBRID_INFERENCE_MODE_PREFER_ON_DEVICE = 1;
    HYBRID_INFERENCE_MODE_ONLY_ON_DEVICE   = 2;
    HYBRID_INFERENCE_MODE_PREFER_IN_CLOUD  = 3;
    HYBRID_INFERENCE_MODE_ONLY_IN_CLOUD    = 4;
}

// A candidate must pass every hard filter to stay in the running.
message HybridFilter {
    oneof kind {
        bool network = 1;
        BatteryFilter battery = 2;
        CustomFilter custom = 3;
    }
}

message BatteryFilter {
    // Charge floor, 0-100, below which the on-device candidate is dropped.
    int32 min_battery_percent = 1 [
        (runanywhere.v1.rac_default) = "20",
        (runanywhere.v1.rac_min) = 0,
        (runanywhere.v1.rac_max) = 100
    ];
}

message CustomFilter {
    string name        = 1;
    string description = 2;
}

message HybridCascade {
    oneof kind {
        ConfidenceCascade confidence = 1;
    }
}

// Below this on-device confidence, the router escalates to cloud.
message ConfidenceCascade {
    float threshold = 1 [
        (runanywhere.v1.rac_default) = "0.5",
        (runanywhere.v1.rac_min_float) = 0.0,
        (runanywhere.v1.rac_max_float) = 1.0
    ];
}

// The candidate chain for one routed request: tried first to last, first
// success wins, position IS the priority. `mode` still governs whether the
// chain may cross the on-device/cloud line.
message HybridRoutingPolicy {
    repeated HybridFilter hard_filters = 1;
    HybridCascade         cascade      = 2;
    HybridInferenceMode   mode         = 3;

    // Per-ATTEMPT deadline, not the overall request deadline. When a candidate
    // has produced nothing within this many milliseconds it is abandoned and
    // the next candidate is tried. 0 = no per-attempt deadline.
    int32                 attempt_timeout_ms = 4 [
        (runanywhere.v1.rac_default) = "0",
        (runanywhere.v1.rac_min) = 0
    ];

    // Ordered candidates, priority first. Replaces the offline/online pair.
    repeated HybridModelDescriptor models = 5;
}

message HybridModelDescriptor {
    string model_id     = 1;

    // True = this candidate runs ON DEVICE (and is exempt from the network and
    // battery filters). False = it runs IN CLOUD. Firebase/Android vocabulary.
    bool   is_on_device = 2;

    // The plugin-registry engine name the runtime already pins on: "sherpa",
    // "llamacpp", "onnx", "qhexrt", "mlx", "cloud", or any name passed to
    // registerCloudProvider(). Empty = let the registry pick by priority.
    string engine       = 3;
}

// What the router actually did, including the failed primary attempt.
message HybridRoutedMetadata {
    string chosen_model_id        = 1;
    bool   was_fallback           = 2;
    int32  attempt_count          = 3;
    int32  primary_error_code     = 4;
    string primary_error_message  = 5;

    // Absent (not NaN, not 0.0) when the engine reports no quality score.
    optional float confidence         = 6;
    // Absent unless a confidence cascade discarded a primary answer.
    optional float primary_confidence = 7;

    // True when the answer was produced ON DEVICE. This is the field an app
    // reads to truthfully claim "processed on your device"; never infer it by
    // comparing chosen_model_id.
    bool   served_on_device       = 8;
}

message CloudSttBackendConfig {
    string provider      = 1;
    string model         = 2;

    // SECRET. Held in memory only; never logged, never persisted, never
    // included in a toString()/toJSON() dump.
    string api_key       = 3;
    string language_code = 4;
    string base_url      = 5;
    int32  timeout_ms    = 6;
}

message HybridSttTranscribeOptions {
    string language     = 1;
    int32  sample_rate  = 2;

    // Container the bytes are already in. UNSPECIFIED (the proto3 zero) means
    // headerless PCM16, which commons wraps in a WAV container.
    AudioFormat audio_format = 3;
}

message HybridSttTranscribeRequest {
    bytes                       audio_bytes = 1;
    HybridSttTranscribeOptions  options     = 2;
}

message HybridSttTranscribeResponse {
    int32                rc                = 1;
    string               text              = 2;
    string               detected_language = 3;
    HybridRoutedMetadata routing           = 4;
}
