// RunAnywhere IDL — LoRA adapter catalog, application, and state.
//
// Adapter file acquisition, sandbox handles, and backend load/unload stay
// adapter and backend owned.

syntax = "proto3";

package runanywhere.v1;

import "rac_options.proto";

option cc_enable_arenas          = true;
option java_multiple_files       = true;
option java_package              = "ai.runanywhere.proto.v1";
option java_outer_classname      = "LoraOptionsProto";
option objc_class_prefix         = "RAV1";
option csharp_namespace          = "Runanywhere.V1";
option swift_prefix              = "RA";
option go_package                = "github.com/runanywhere/runanywhere-sdks/idl/v1;runanywherev1";

message LoRAAdapterConfig {
    // On-disk path to the GGUF file.
    string          adapter_path = 1 [(runanywhere.v1.rac_required) = true];

    float           scale        = 2 [(runanywhere.v1.rac_default) = "1.0"];

    // Links back to a catalog entry when the adapter came from one.
    optional string adapter_id   = 3;

    map<string, string> metadata = 4;

    // Not read by commons.
    repeated string target_modules = 5;
}

message LoRAAdapterInfo {
    // Catalog id when known, else empty.
    string          adapter_id    = 1;

    string          adapter_path  = 2;
    float           scale         = 3;

    // Whether it is currently applied to the context.
    bool            applied       = 4;

    // Populated when applied is false.
    optional string error_message = 5;
    int32           error_code    = 6;

    int64           loaded_at_ms  = 7;
}

message LoraAdapterCatalogEntry {
    string          id                = 1;
    string          name              = 2;
    string          description       = 3;

    // Direct .gguf download URL, and the filename to save it as.
    string          url               = 4;
    string          filename          = 5;

    // Explicit base model ids this adapter works with.
    repeated string compatible_models = 6;

    // 0 if unknown.
    int64           size_bytes        = 7;

    optional string author            = 8;
    float           default_scale     = 9 [(runanywhere.v1.rac_default) = "1.0"];

    // Lowercase hex.
    optional string checksum_sha256   = 10;

    optional string license           = 11;
    repeated string tags              = 12;
    map<string, string> metadata      = 13;

    // Local artifact state, persisted only after the platform reports success.
    optional string local_path        = 14;
    optional bool   is_downloaded     = 15;
    optional int64  downloaded_at_unix_ms = 16;
    optional bool   is_imported       = 17;
    optional string status_message    = 18;
}

message LoraAdapterCatalogQuery {
    optional string adapter_id      = 1;
    optional string model_id        = 2;
    optional bool   downloaded_only = 3;
    optional string search_query    = 4;
    repeated string tags            = 5;
}

message LoraAdapterCatalogListRequest {
    optional LoraAdapterCatalogQuery query = 1;
    bool include_counts = 2;
}

message LoraAdapterCatalogListResult {
    bool success = 1;
    repeated LoraAdapterCatalogEntry entries = 2;
    string error_message = 3;

    // total_count is unfiltered; filtered_count reflects the query.
    int32 total_count = 4;
    int32 filtered_count = 5;
    int32 downloaded_count = 6;
}

message LoraAdapterCatalogGetRequest {
    string adapter_id = 1;
}

message LoraAdapterCatalogGetResult {
    bool found = 1;
    LoraAdapterCatalogEntry entry = 2;
    string error_message = 3;
}

message LoraAdapterDownloadCompletedRequest {
    string adapter_id = 1;
    string local_path = 2;
    optional int64 size_bytes = 3;
    optional string checksum_sha256 = 4;
    optional int64 completed_at_unix_ms = 5;
    bool imported = 6;
    string status_message = 7;
}

message LoraAdapterDownloadCompletedResult {
    bool success = 1;
    LoraAdapterCatalogEntry entry = 2;
    string error_message = 3;
    bool persisted = 4;
}

message LoraAdapterImportRequest {
    // Platform-readable path of the picked file.
    string source_path = 1;

    // Defaults to basename(source_path).
    optional string filename = 2;
}

message LoraAdapterImportResult {
    bool success = 1;
    string error_message = 2;

    // Stable SDK-owned path of the imported file.
    string local_path = 3;

    // Whether a catalog entry matched and was completed.
    bool matched = 4;
    LoraAdapterCatalogEntry entry = 5;
}

message LoraCompatibilityResult {
    bool            is_compatible       = 1;

    // Populated when is_compatible is false.
    optional string error_message       = 2;

    optional string base_model_required = 3;
    repeated string warnings           = 4;
    int32           error_code          = 5;
}

message LoRAApplyRequest {
    string request_id = 1;
    repeated LoRAAdapterConfig adapters = 2;

    // Drop currently-applied adapters instead of stacking.
    bool replace_existing = 3;
}

message LoRAApplyResult {
    string request_id = 1;
    repeated LoRAAdapterInfo adapters = 2;
    bool success = 3;
    optional string error_message = 4;
    int32 error_code = 5;
}

message LoRARemoveRequest {
    string request_id = 1;

    // Remove by id or by path; clear_all ignores both lists.
    repeated string adapter_ids = 2;
    repeated string adapter_paths = 3;
    bool clear_all = 4;
}

// Also serves as the request for List and State, carrying optional
// base_model_id filtering without a separate empty request type.
message LoRAState {
    repeated LoRAAdapterInfo loaded_adapters = 1;
    bool has_active_adapters = 2;
    optional string base_model_id = 3;
    optional string error_message = 4;
    int32 error_code = 5;
}
