name: IDL gate

# GENERATE, THEN VERIFY — not "regenerate and diff".
#
# Most of the language bindings are no longer committed (.gitignore, and
# idl/codegen/generated_trees.txt lists exactly which). The old shape of this
# job — regenerate, then require `git status --porcelain -uall` to be empty —
# cannot fail for those: regenerating an ignored file never moves git status.
# So it was rewritten rather than amended. What runs now:
#
#   1. schema lock   idl/SCHEMA_LOCK is tracked and refreshed by generate_all.sh
#                    from the .proto digest. Editing a schema without running
#                    codegen leaves the committed lock stale -> fail. This is
#                    the drift signal that replaces the diff.
#   2. presence      every declared generated tree exists and is non-empty
#                    (generate_all.sh soft-skips generators whose toolchain is
#                    missing, so its exit code proves nothing on its own).
#   3. still-tracked C++ and Kotlin bindings ARE committed; for those the
#                    classic diff gate still applies and is still run.
#   4. compile       the generated TypeScript is fed to tsc and the generated
#                    Python is imported. Un-reviewable output has to be
#                    machine-checked instead.
#
# Fixing a failure locally:
#   ./idl/codegen/generate_all.sh
#   git add idl/SCHEMA_LOCK core/src/generated core/include bindings/kotlin

on:
  pull_request:
    paths:
      # Inputs to codegen.
      - 'idl/**'
      - 'core/VERSIONS'
      - 'scripts/setup/setup-toolchain.sh'
      - '.github/actions/setup-toolchain/action.yml'
      - '.github/workflows/idl-drift-check.yml'
      # The generated trees that are STILL COMMITTED — a hand-edit to one of
      # these must still trigger the gate. The de-committed trees are gone from
      # this list on purpose: they are untracked, so no PR can ever touch them
      # and the filters were dead weight pointing at paths that cannot change.
      - 'core/src/generated/proto/**'
      - 'core/include/rac/rac_defaults_generated.h'
      - 'bindings/kotlin/src/main/kotlin/com/runanywhere/sdk/generated/**'
      # Hand-written files that live inside an otherwise-generated tree.
      - 'bindings/proto-ts/src/index.ts'
      - 'bindings/proto-ts/src/lifecycle_service.ts'
      - 'bindings/proto-ts/src/convenience/_errors.ts'
      - 'bindings/proto-ts/src/convenience/errors_category.ts'
      - 'bindings/proto-ts/src/events/public_events.ts'
      - 'bindings/proto-ts/src/streams/**'
      - 'bindings/proto-ts/package.json'
      - 'bindings/proto-ts/tsconfig.json'
      # The publish paths that must generate before packaging.
      - 'bindings/swift/scripts/sync-dist-repo.sh'
      - 'bindings/*/scripts/package-sdk.sh'
      - 'bindings/python/pyproject.toml'
      - 'bindings/python/_build/**'
      - 'scripts/setup/setup.sh'
      - '.gitignore'
  push:
    # Include long-lived integration branches so a
    # direct push that touches IDL-adjacent files without a PR still
    # gets the gate.
    branches: [main, feat/v2-architecture]
    paths:
      - 'idl/**'
      - 'core/VERSIONS'
      - 'scripts/setup/setup-toolchain.sh'
      - '.github/actions/setup-toolchain/action.yml'
      - '.github/workflows/idl-drift-check.yml'
      - 'core/src/generated/proto/**'
      - 'core/include/rac/rac_defaults_generated.h'
      - 'bindings/kotlin/src/main/kotlin/com/runanywhere/sdk/generated/**'
      - 'bindings/proto-ts/src/index.ts'
      - 'bindings/proto-ts/src/lifecycle_service.ts'
      - 'bindings/proto-ts/src/convenience/_errors.ts'
      - 'bindings/proto-ts/src/convenience/errors_category.ts'
      - 'bindings/proto-ts/src/events/public_events.ts'
      - 'bindings/proto-ts/src/streams/**'
      - 'bindings/proto-ts/package.json'
      - 'bindings/proto-ts/tsconfig.json'
      - 'bindings/swift/scripts/sync-dist-repo.sh'
      - 'bindings/*/scripts/package-sdk.sh'
      - 'bindings/python/pyproject.toml'
      - 'bindings/python/_build/**'
      - 'scripts/setup/setup.sh'
      - '.gitignore'

permissions:
  contents: read

jobs:
  check:
    name: Generate every binding, then verify it
    # macos-15 ships Xcode 16 with Swift 6, which is the minimum
    # required by Homebrew's grpc-swift v2 formula. On macos-14 the formula
    # bails with "protoc-gen-grpc-swift: An unsatisfied requirement failed
    # this build", which previously masked the Swift gRPC plugin install and
    # let downstream `protoc --grpc-swift_out=` discoveries silently fail.
    runs-on: macos-15
    # A cold runner (Homebrew cache miss) installs protobuf, swift-protobuf,
    # and grpc-swift from scratch, which can take a while on macos-15.
    # Subsequent runs hit the actions/cache restore path and finish fast.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          # Two commits, so the base copy of idl/SCHEMA_LOCK is reachable for
          # the "did IDL_VERSION move with the schema?" check below.
          fetch-depth: 2
      - uses: ./.github/actions/setup-toolchain
        with:
          platform: node

      - name: Install protoc + swift-protobuf (Homebrew)
        run: |
          set -euo pipefail
          brew install protobuf swift-protobuf

      - name: Install grpc-swift (v2 plugin → Swift AsyncStream gRPC stubs)
        run: |
          set -euo pipefail
          # grpc-swift v2 requires Swift 6 / Xcode 16 (macos-15 runner).
          # Fail loud if the install does not produce protoc-gen-grpc-swift —
          # silently skipping previously let Swift gRPC drift through CI.
          #
          # grpc-swift formula installs the binary as
          # protoc-gen-grpc-swift-2; symlink to the legacy name the codegen
          # script expects so `protoc --grpc-swift_out=` invocations resolve.
          brew install grpc-swift
          if [ -x /opt/homebrew/bin/protoc-gen-grpc-swift-2 ]; then
            ln -sf /opt/homebrew/bin/protoc-gen-grpc-swift-2 /opt/homebrew/bin/protoc-gen-grpc-swift
          fi
          if ! command -v protoc-gen-grpc-swift >/dev/null 2>&1; then
            echo "::error::protoc-gen-grpc-swift not on PATH after brew install grpc-swift"
            exit 1
          fi

      - name: Set up JDK 17 (runtime for wire-compiler)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install wire-compiler (Square Wire — Kotlin proto codegen)
        run: |
          set -euo pipefail
          # IMPORTANT: Homebrew's `wire` formula is the Wire *messaging app*
          # (wire.com), NOT Square's protobuf compiler. The previous
          # `brew install wire` therefore never produced a `wire-compiler`
          # binary, so generate_kotlin.sh silently fell back to warn-and-skip
          # (the Gradle Wire plugin only regenerates at app build time, NOT in
          # this drift job) — Kotlin bindings drifted through CI undetected.
          #
          # Install the real wire-compiler from Maven Central, pinned to
          # WIRE_VERSION in core/VERSIONS (the same version
          # that produced the committed Kotlin bindings), and expose it as
          # `wire-compiler` on PATH. Hard-fail if it is missing, matching the
          # protoc-gen-grpc-swift gate above.
          WIRE_VERSION="$(grep -E '^WIRE_VERSION=' core/VERSIONS | cut -d= -f2)"
          echo "wire-compiler version (pinned): ${WIRE_VERSION}"
          JAR_URL="https://repo1.maven.org/maven2/com/squareup/wire/wire-compiler/${WIRE_VERSION}/wire-compiler-${WIRE_VERSION}-jar-with-dependencies.jar"
          mkdir -p "$HOME/.local/bin"
          curl --fail --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 2 \
            -o "$HOME/.local/bin/wire-compiler.jar" "$JAR_URL"
          # The generated wrapper must expand HOME and argv when it runs,
          # not while this workflow step writes it.
          # shellcheck disable=SC2016
          printf '#!/usr/bin/env bash\nexec java -jar "$HOME/.local/bin/wire-compiler.jar" "$@"\n' > "$HOME/.local/bin/wire-compiler"
          chmod +x "$HOME/.local/bin/wire-compiler"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Wire 5.5.1 has no --help/--version flag and intentionally exits 1
          # without generation arguments. Probe its exact diagnostic without
          # letting pipefail turn that expected exit into a false install error.
          WIRE_PROBE="$(java -jar "$HOME/.local/bin/wire-compiler.jar" 2>&1 || true)"
          if ! grep -Fq 'Nothing to do! Specify --java_out=' <<<"$WIRE_PROBE"; then
            echo "::error::wire-compiler not runnable after Maven download (${JAR_URL})"
            exit 1
          fi

      - name: Install Dart 3.x
        # macos-{14,15} runners do not ship Dart by default, so the
        # previous `command -v dart` gate silently skipped the Dart codegen
        # and let Flutter bindings drift (e.g. tool_call additions to
        # LLMStreamEvent / LLMStreamFinalResult in idl/llm_service.proto were
        # not regenerated into lib/generated/llm_service.pb.dart). Pin Dart
        # 3.0+ here so generate_dart.sh always runs in CI.
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dart plugin (protoc-gen-dart)
        # Pinned to PROTOC_GEN_DART_VERSION in core/VERSIONS
        # (single source of truth for IDL codegen toolchain). Bump there first
        # — this workflow mirrors that pin.
        run: |
          set -euo pipefail
          PROTOC_GEN_DART_VERSION="$(grep -E '^PROTOC_GEN_DART_VERSION=' core/VERSIONS | cut -d= -f2)"
          dart pub global activate protoc_plugin "$PROTOC_GEN_DART_VERSION"
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Install ts-proto (npm)
        # Pinned to TS_PROTO_VERSION in core/VERSIONS
        # (single source of truth). Major-bumped to 2.x; generated TS still
        # parses under tsc 5.9 strict.
        run: |
          set -euo pipefail
          TS_PROTO_VERSION="$(grep -E '^TS_PROTO_VERSION=' core/VERSIONS | cut -d= -f2)"
          npm install -g "ts-proto@${TS_PROTO_VERSION}" protobufjs

      - name: Install Python protobuf + pyyaml runtime
        # idl/codegen/generate_*_convenience.py drivers import
        # `google.protobuf.descriptor_pb2` and the swift modality
        # ABI generator parses YAML schemas, so the system Python
        # needs both packages available before generate_all.sh runs.
        run: |
          set -euo pipefail
          PYTHON_PROTOBUF_VERSION="$(grep -E '^PYTHON_PROTOBUF_VERSION=' core/VERSIONS | cut -d= -f2)"
          # python3 is REQUIRED in CI. generate_all.sh soft-skips every
          # convenience + modality-ABI generator with a warning (exit 0) when
          # python3 is absent, which would let annotation edits pass the drift
          # gate while regenerating nothing. Fail loud if it is missing.
          if ! command -v python3 >/dev/null 2>&1; then
            echo "::error::python3 not on PATH — required for convenience codegen"
            exit 1
          fi
          python3 -m pip install --upgrade --break-system-packages "protobuf>=${PYTHON_PROTOBUF_VERSION},<7" pyyaml
          # generate_python.sh prefers python3 -m grpc_tools.protoc. Pin to the
          # same major line documented in idl/codegen/generate_python.sh.
          python3 -m pip install --upgrade --break-system-packages 'grpcio-tools==1.71.*'
          python3 -c 'import grpc_tools.protoc'  # fail loud if the install landed elsewhere

      - name: Dump toolchain versions (debug)
        run: |
          set -euo pipefail
          echo "protoc: $(protoc --version)"
          echo "protoc-gen-swift: $(protoc-gen-swift --version 2>/dev/null || echo 'not present')"
          echo "protoc-gen-grpc-swift: $(protoc-gen-grpc-swift --version 2>/dev/null || echo 'not present')"
          echo "wire-compiler: $(wire-compiler --version 2>/dev/null || echo 'not present')"
          echo "dart: $(dart --version 2>&1 || echo 'not present')"
          echo "node: $(node --version)"

      - name: Convenience generator smoke test (golden + cross-SDK parity)
        # Guards the int64/float/double/bool/enum + wire-string generator paths
        # that the production IDL barely exercises, and catches rotted goldens.
        # Sandboxes its own generation (does not touch the working tree), so it
        # is independent of the drift check below. See idl/codegen/tests/README.md.
        run: python3 idl/codegen/tests/test_convenience_generators.py

      - name: Capture the base copy of idl/SCHEMA_LOCK
        # Used by the IDL_VERSION bump check further down. Kept outside the
        # working tree so it cannot be mistaken for a generated artifact.
        id: base_lock
        run: |
          set -euo pipefail
          base_ref=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi
          out="${RUNNER_TEMP}/SCHEMA_LOCK.base"
          if [ -n "$base_ref" ] && git cat-file -e "${base_ref}:idl/SCHEMA_LOCK" 2>/dev/null; then
            git show "${base_ref}:idl/SCHEMA_LOCK" > "$out"
            echo "path=$out" >> "$GITHUB_OUTPUT"
            echo "Base lock captured from ${base_ref}"
          else
            # First commit that introduces the lock, a shallow fetch, or a
            # force-push: nothing to compare against, so the bump check is
            # skipped rather than guessed at.
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "No base idl/SCHEMA_LOCK reachable — bump check will be skipped"
          fi

      - name: Generate every binding, then verify it
        # Runs the same script contributors run locally, so a green CI and a
        # green laptop mean the same thing. --with-compile adds the tsc build of
        # bindings/proto-ts and an import of the generated Python: the
        # de-committed trees cannot be reviewed in a diff any more, so they get
        # machine-checked instead.
        run: ./idl/codegen/ci-drift-check.sh --with-compile

      - name: Require an idl/VERSION bump when the schema changed
        if: steps.base_lock.outputs.path != ''
        run: |
          set -euo pipefail
          ./idl/codegen/schema_lock.sh --check \
            --require-bump "${{ steps.base_lock.outputs.path }}"
