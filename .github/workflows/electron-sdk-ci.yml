# Single Electron CI workflow: TypeScript gates + thin native Option A path.
# Fat-addon lanes are no longer run here — thin (`electron-windows` /
# `electron-macos`) is the CI contract for the package split.
#
# Unit suite is hermetic (pure TypeScript — no models / no GPU). Native jobs
# only prove link + export symbols + loadPlugin smoke.
name: electron-sdk-ci

on:
  push:
    paths:
      - 'sdk/runanywhere-electron/**'
      - 'sdk/runanywhere-commons/**'
      - 'engines/**'
      - 'cmake/**'
      - 'CMakePresets.json'
      - '.github/workflows/electron-sdk-ci.yml'
  pull_request:
    paths:
      - 'sdk/runanywhere-electron/**'
      - 'sdk/runanywhere-commons/**'
      - 'engines/**'
      - 'cmake/**'
      - 'CMakePresets.json'
      - '.github/workflows/electron-sdk-ci.yml'

permissions:
  contents: read
  actions: write

jobs:
  electron:
    name: electron (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            preset: electron-windows
            prebuild_dir: prebuilds/win32-x64-thin
            artifact: electron-native-win32-x64-thin
            plugin_name: runanywhere_llamacpp.dll
            commons_name: rac_commons.dll
            run_typescript: true
          # macos-26 ships Xcode 26.6 (setup-toolchain platform:macos pin).
          # macos-14 fails toolchain setup with "Could not find Xcode version 26.6".
          - os: macos-26
            platform: macos
            preset: electron-macos
            prebuild_dir: prebuilds/darwin-arm64-thin
            artifact: electron-native-darwin-arm64-thin
            plugin_name: librunanywhere_llamacpp.dylib
            commons_name: librac_commons.dylib
            run_typescript: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          platform: ${{ matrix.platform }}

      - uses: actions/setup-node@v4
        with:
          # 22+ so `node --test` expands globs (Node 20 treats them as literals).
          node-version: '22'

      # --- TypeScript gates (Windows only — Linux coverage is pr-build electron-unit) ---
      - name: SDK install / typecheck / unit tests
        if: matrix.run_typescript
        working-directory: sdk/runanywhere-electron
        shell: bash
        run: |
          set -euo pipefail
          npm install
          # Tests import ../../dist; typecheck of tsconfig.test.json needs dist/.
          npm run build
          # Example path aliases point at packages/*/dist/*.d.ts — build backends too.
          for pkg in packages/llamacpp packages/onnx packages/sherpa; do
            (cd "$pkg" && npm install && npm run build)
          done
          npm run typecheck
          npm test

      # --- Thin native Option A ---
      - name: Install addon node deps
        working-directory: sdk/runanywhere-electron/native
        shell: bash
        run: npm install

      - name: Fetch node-gyp headers (Windows N-API link)
        if: runner.os == 'Windows'
        id: nodedev
        shell: pwsh
        run: |
          npx --yes node-gyp install
          $ver = (node -p "process.versions.node")
          $dir = "$env:LOCALAPPDATA/node-gyp/Cache/$ver"
          if (!(Test-Path "$dir/x64/node.lib")) { throw "node.lib missing under $dir" }
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # RAC_DESKTOP_ADAPTER=ON needs libcurl. macOS has system curl; Windows MSVC
      # gets a static vcpkg package (no libcurl.dll sidecar for the loadPlugin smoke).
      - name: Install static libcurl (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is unset on this runner"
          }
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install curl:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw "vcpkg curl:x64-windows-static install failed" }

      - name: Configure thin preset
        shell: bash
        run: |
          set -euo pipefail
          # Avoid `extra=(); "${extra[@]}"` — bash 3.2 + `set -u` treats an empty
          # array as unbound (macOS runners).
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake --preset "${{ matrix.preset }}" \
              -DCMAKE_TOOLCHAIN_FILE="${VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake" \
              -DVCPKG_TARGET_TRIPLET=x64-windows-static \
              -DRAC_BACKEND_SHERPA=OFF \
              -DRAC_NODE_DEV_DIR="${{ steps.nodedev.outputs.dir }}"
          else
            cmake --preset "${{ matrix.preset }}" -DRAC_BACKEND_SHERPA=OFF
          fi

      - name: Build thin .node + commons + llamacpp
        shell: bash
        run: |
          set -euo pipefail
          jobs="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.logicalcpu)"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cmake --build --preset "${{ matrix.preset }}" \
              --target rac_commons runanywhere_llamacpp runanywhere_native
          else
            cmake --build --preset "${{ matrix.preset }}" -j "$jobs" \
              --target rac_commons runanywhere_llamacpp runanywhere_native
          fi

      - name: Assert symbols + stage prebuild + loadPlugin smoke
        shell: bash
        working-directory: sdk/runanywhere-electron
        env:
          PRESET: ${{ matrix.preset }}
          PREBUILD_DIR: ${{ matrix.prebuild_dir }}
          PLUGIN_NAME: ${{ matrix.plugin_name }}
          COMMONS_NAME: ${{ matrix.commons_name }}
        run: |
          set -euo pipefail
          root="${GITHUB_WORKSPACE}/build/${PRESET}"
          out="${PREBUILD_DIR}"
          mkdir -p "$out"

          if [[ "${{ runner.os }}" == "Windows" ]]; then
            node_path="$root/sdk/runanywhere-electron/native/Release/runanywhere_native.node"
            commons_path="$root/sdk/runanywhere-commons/Release/${COMMONS_NAME}"
            llama_dir="$root/engines/llamacpp/Release"
            plugin_path="$llama_dir/${PLUGIN_NAME}"

            for p in "$node_path" "$commons_path" "$plugin_path"; do
              test -f "$p" || { echo "missing thin artifact: $p"; exit 1; }
              echo "ok $p ($(wc -c < "$p") bytes)"
            done

            # dumpbin export gate
            # Git Bash cannot expand ${PROGRAMFILES(x86)} (parens break
            # parameter expansion), and bare printenv fails under set -e when
            # the var is absent. Prefer the fixed Git-Bash path on GHA.
            vswhere=""
            for candidate in \
              "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
              "/c/Program Files/Microsoft Visual Studio/Installer/vswhere.exe"
            do
              if [[ -x "$candidate" ]]; then
                vswhere="$candidate"
                break
              fi
            done
            if [[ -z "$vswhere" ]]; then
              pf86="$(printenv 'PROGRAMFILES(x86)' 2>/dev/null || printenv 'ProgramFiles(x86)' 2>/dev/null || true)"
              if [[ -n "$pf86" && -x "$pf86/Microsoft Visual Studio/Installer/vswhere.exe" ]]; then
                vswhere="$pf86/Microsoft Visual Studio/Installer/vswhere.exe"
              fi
            fi
            test -n "$vswhere" && test -x "$vswhere" || {
              echo "vswhere.exe not found (checked Git-Bash Program Files paths)"
              exit 1
            }
            echo "using vswhere: $vswhere"
            vs="$("$vswhere" -latest -products '*' \
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 \
              -property installationPath | tr -d '\r')"
            test -n "$vs" || { echo "VS 2022 install path not found"; exit 1; }
            # vswhere returns a Windows path (C:\...); map to Git-Bash /c/...
            vs_unix="$(cygpath -u "$vs" 2>/dev/null || echo "$vs" | sed -e 's#^\([A-Za-z]\):#/\L\1#' -e 's#\\#/#g')"
            dumpbin="$(find "$vs_unix/VC/Tools/MSVC" -name dumpbin.exe 2>/dev/null | grep 'Hostx64/x64/dumpbin.exe' | head -1 || true)"
            test -n "$dumpbin" || { echo "dumpbin.exe not found under $vs_unix/VC/Tools/MSVC"; exit 1; }
            echo "using dumpbin: $dumpbin"

            assert_export() {
              local dll="$1"; shift
              echo "=== dumpbin /EXPORTS $dll ==="
              local out
              out="$("$dumpbin" /EXPORTS "$dll" 2>&1)"
              echo "$out"
              for sym in "$@"; do
                echo "$out" | grep -E "\\b${sym}\\b" >/dev/null || {
                  echo "missing export '$sym' in $dll"; exit 1
                }
                echo "  ok export: $sym"
              done
            }
            assert_export "$commons_path" rac_init rac_registry_load_plugin rac_llm_extract_thinking
            assert_export "$plugin_path" rac_plugin_entry_llamacpp

            cp "$node_path" "$out/"
            cp "$commons_path" "$out/"
            cp "$plugin_path" "$out/"
            # Backend sidecar + other Release DLLs beside the carrier.
            if [[ -f "$llama_dir/rac_backend_llamacpp.dll" ]]; then
              cp "$llama_dir/rac_backend_llamacpp.dll" "$out/"
            fi
            for dll in "$llama_dir"/*.dll; do
              base="$(basename "$dll")"
              [[ -f "$out/$base" ]] || cp "$dll" "$out/"
            done
          else
            node_path="$root/sdk/runanywhere-electron/native/runanywhere_native.node"
            commons_path="$root/sdk/runanywhere-commons/${COMMONS_NAME}"
            llama_dir="$root/engines/llamacpp"
            plugin_path="$llama_dir/${PLUGIN_NAME}"

            for p in "$node_path" "$commons_path" "$plugin_path"; do
              test -f "$p" || { echo "missing thin artifact: $p"; exit 1; }
              echo "ok $p ($(wc -c < "$p") bytes)"
            done

            echo "=== nm -gU ${COMMONS_NAME} (filtered) ==="
            nm -gU "$commons_path" | grep -E ' _rac_(init|registry_load_plugin|llm_extract_thinking)$' || {
              echo "missing expected rac_* exports in ${COMMONS_NAME}"
              nm -gU "$commons_path" | grep ' _rac_' | head -40
              exit 1
            }
            echo "=== nm -gU ${PLUGIN_NAME} (entry) ==="
            nm -gU "$plugin_path" | grep -E ' _rac_plugin_entry_llamacpp$' || {
              echo "missing rac_plugin_entry_llamacpp in ${PLUGIN_NAME}"
              exit 1
            }
            echo "ok export: rac_plugin_entry_llamacpp"

            cp "$node_path" "$out/"
            cp "$commons_path" "$out/"
            cp "$plugin_path" "$out/"
            if [[ -f "$llama_dir/librac_backend_llamacpp.dylib" ]]; then
              cp "$llama_dir/librac_backend_llamacpp.dylib" "$out/"
            fi
          fi

          ls -la "$out"
          test -f "$out/runanywhere_native.node"
          test -f "$out/${COMMONS_NAME}"
          test -f "$out/${PLUGIN_NAME}"

          # loadPlugin smoke (no models / no generate)
          export RA_THIN_STAGE="$(pwd)/$out"
          export RA_THIN_PLUGIN="$RA_THIN_STAGE/${PLUGIN_NAME}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export PATH="$RA_THIN_STAGE;$PATH"
          fi
          node <<'EOF'
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const stage = process.env.RA_THIN_STAGE;
          const pluginPath = process.env.RA_THIN_PLUGIN;
          const nodePath = path.join(stage, "runanywhere_native.node");
          if (!fs.existsSync(nodePath)) throw new Error("missing " + nodePath);
          if (!fs.existsSync(pluginPath)) throw new Error("missing " + pluginPath);
          const addon = require(nodePath);
          if (addon.thinAddon !== true) {
            throw new Error("expected thinAddon === true, got " + addon.thinAddon);
          }
          console.log(
            "thinAddon=true pluginApiVersion=" +
              (typeof addon.pluginApiVersion === "function" ? addon.pluginApiVersion() : "n/a")
          );
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), "ra-thin-ci-"));
          (async () => {
            await addon.initialize(tmp, tmp);
            await addon.loadPlugin(pluginPath);
            const listed = addon.listPlugins();
            console.log("listPlugins=" + JSON.stringify(listed));
            if (!listed.map(String).some((n) => /llama/i.test(n))) {
              throw new Error("llamacpp missing after loadPlugin: " + JSON.stringify(listed));
            }
            console.log("loadPlugin smoke OK");
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF

      - name: Upload thin native prebuild
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: sdk/runanywhere-electron/${{ matrix.prebuild_dir }}/
          if-no-files-found: error
