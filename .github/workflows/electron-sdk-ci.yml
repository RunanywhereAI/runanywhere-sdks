# CI for @runanywhere/electron. The unit suite is hermetic (pure TypeScript — no
# native addon, no models), so it builds and runs anywhere. The native addon + the
# feature suite need MSVC + the compiled commons/engines and run separately.
#
# Everything in the package is TypeScript, including the tests and the build
# scripts. The tests compile to dist-test/ (tsconfig.test.json) and `node --test`
# runs that output, which is why the glob below is dist-test/unit rather than test/.
name: electron-sdk-ci

on:
  push:
    paths:
      - 'sdk/runanywhere-electron/**'
      - 'examples/electron/**'
      - '.github/workflows/electron-sdk-ci.yml'
  pull_request:
    paths:
      - 'sdk/runanywhere-electron/**'
      - 'examples/electron/**'
      - '.github/workflows/electron-sdk-ci.yml'

# Least-privilege: this workflow only needs to read the repo contents.
permissions:
  contents: read

jobs:
  unit:
    # Windows is where the addon ships, so keep a Windows lane over the TS build
    # and the unit suite. The always-on Linux lane is `electron-unit` in
    # pr-build.yml.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sdk/runanywhere-electron
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          # 22+ so `node --test` expands the "dist-test/unit/**/*.test.js" glob
          # (glob support landed in Node 21; Node 20 treats it as a literal path).
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Type-check + build
        run: npm run build
      # Every project including the tests and the build scripts, so a test file
      # that lies about a type fails here with a clear signal rather than inside
      # the test run.
      - name: Type-check (all projects)
        run: npm run typecheck
      # Runs `pretest` first, which builds src/ -> dist/ and test/ -> dist-test/.
      - name: Unit tests
        run: npm test

  # The demo app has its own hermetic unit tests (the JSON store: atomic writes,
  # corrupt-file recovery, conversation capping). They need no Electron runtime.
  demo-app-unit:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/electron/RunAnywhereAI
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests (no Electron, no models)
        run: npm test

  # The native addon is NOT built by the job above, so a change that breaks the
  # C++ bindings (a bad signature, a missing symbol, a renamed rac_* call) used to
  # ship undetected — the .node is built by hand and is gitignored. This job
  # compiles it on every PR that touches the addon or commons. It does not run
  # inference: linking is the signal we are missing today.
  native-addon-build:
    # The .node is gitignored and built by hand, so a change that breaks the C++
    # bindings (a bad signature, a missing symbol, a renamed rac_* call) would
    # otherwise ship undetected. This compiles it on every PR.
    #
    # windows-2022, NOT windows-latest: the windows-release preset uses the
    # "Visual Studio 17 2022" generator, which newer runner images no longer
    # provide. This mirrors the rcli-windows job in pr-build.yml.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          platform: windows
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # node-addon-api + node-api-headers live in native/, not the SDK root.
      - name: Install the addon's node deps
        shell: pwsh
        working-directory: sdk/runanywhere-electron/native
        run: npm install
      # node-gyp caches headers + node.lib under the RUNNER's Node version, which
      # is not the version CMake defaults to — resolve it and pass it explicitly.
      - name: Fetch the node headers + import lib the N-API link needs
        id: nodedev
        shell: pwsh
        run: |
          npx --yes node-gyp install
          $ver = (node -p "process.versions.node")
          $dir = "$env:LOCALAPPDATA/node-gyp/Cache/$ver"
          if (!(Test-Path "$dir/x64/node.lib")) { throw "node.lib missing under $dir" }
          "dir=$dir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Configure
        shell: pwsh
        run: |
          cmake --preset windows-release `
            -DRAC_BUILD_BACKENDS=ON -DRAC_BACKEND_LLAMACPP=ON `
            -DRAC_BACKEND_ONNX=ON -DRAC_RUNTIME_ONNXRT=ON -DRAC_BACKEND_SHERPA=OFF `
            -DRAC_STATIC_PLUGINS=ON -DRAC_BUILD_ELECTRON_ADDON=ON `
            "-DRAC_NODE_DEV_DIR=${{ steps.nodedev.outputs.dir }}"
      - name: Build the addon
        shell: pwsh
        run: cmake --build build/windows-release --target runanywhere_native --config Release
      - name: Assert the addon was produced
        shell: pwsh
        run: |
          $node = "build/windows-release/sdk/runanywhere-electron/native/Release/runanywhere_native.node"
          if (!(Test-Path $node)) { throw "the native addon was not produced" }
          Write-Host "addon built: $((Get-Item $node).Length) bytes"
