name: No baked credentials

# The SDK's only control-plane write path is the backend REST API. A build must
# never carry a database URL, project ref, anon key, or token — which
# environment it talks to is just the injected base URL.
#
# This exists because a stale, git-ignored development_config.cpp on developer
# machines still held a Supabase project URL, an anon key, and a build token
# from when the C++ wrote analytics rows straight to the database, and a build
# flag could compile it in verbatim. The flag is gone; this keeps it gone.

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  scan:
    name: Reject credentials in shipped sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan core/, rcli/, bindings/ for baked credentials
        run: |
          set -uo pipefail
          status=0

          scan() {
            local label="$1" pattern="$2"
            # Only tracked, shipped sources. Generated/vendored trees are excluded
            # because they are not what gets committed.
            local hits
            hits=$(git grep -nIE "$pattern" -- \
              'core/**' 'rcli/**' 'bindings/**' \
              ':(exclude)**/node_modules/**' \
              ':(exclude)**/third_party/**' \
              ':(exclude)**/.build/**' \
              ':(exclude)**/build/**' \
              ':(exclude)**/jniLibs/**' \
              ':(exclude)**/*.lock' || true)
            if [ -n "$hits" ]; then
              echo "::error::$label"
              echo "$hits"
              status=1
            fi
          }

          # A Supabase project origin in shipped source means something is
          # talking to the database directly instead of going through the API.
          scan "Direct Supabase endpoint in shipped source — use the backend REST API" \
               '[a-z0-9]{20}\.supabase\.(co|in)'

          # A JWT literal (Supabase anon/service keys are JWTs).
          scan "Hard-coded JWT literal in shipped source" \
               'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}'

          # Build tokens and org API keys.
          scan "Hard-coded build token in shipped source" \
               'bt_[0-9a-f]{8}-[0-9a-f]{4}-'
          scan "Hard-coded RunAnywhere API key in shipped source" \
               'runa_(prod|test|dev)_[A-Za-z0-9_-]{8,}'

          # The retired escape hatch must not come back.
          if git grep -nI 'RAC_INCLUDE_LOCAL_DEV_CONFIG' -- \
               ':(exclude)core/CMakeLists.txt' ':(exclude).github/**' | grep -q .; then
            echo "::error::RAC_INCLUDE_LOCAL_DEV_CONFIG reintroduced — it allowed a \
          machine-local credentials file to be compiled into a build."
            git grep -nI 'RAC_INCLUDE_LOCAL_DEV_CONFIG' -- \
              ':(exclude)core/CMakeLists.txt' ':(exclude).github/**' || true
            status=1
          fi

          # The one local file that used to carry credentials must stay ignored.
          if git ls-files --error-unmatch \
               core/src/infrastructure/network/development_config.cpp >/dev/null 2>&1; then
            echo "::error::development_config.cpp is tracked — it must stay git-ignored; \
          builds compile the credential-free .template instead."
            status=1
          fi

          if [ "$status" -eq 0 ]; then
            echo "OK — no baked credentials in shipped sources."
          fi
          exit "$status"
