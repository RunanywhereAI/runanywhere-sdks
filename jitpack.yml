# JitPack build configuration for RunAnywhere Kotlin SDK
# https://jitpack.io/docs/BUILDING/
#
# The Kotlin SDK is in subdirectory: bindings/kotlin/
# Build all modules (main SDK + LlamaCPP + ONNX backends)
#
# IMPORTANT: For Android libraries with native libs, we must:
# 1. Set up Android SDK (JitPack doesn't have it by default)
# 2. Download native libs FIRST (they're built by our CI/CD)
# 3. Build Android targets explicitly
# 4. Publish to Maven Local

jdk:
  - openjdk17

# Install Android SDK and NDK (required for AAR builds)
before_install:
  - chmod +x bindings/kotlin/gradlew
  # The Kotlin bindings under bindings/kotlin/src/main/kotlin/.../generated are
  # IDL codegen output and are NOT in the repository. The Gradle build
  # regenerates them from `preBuild` (task `generateIdlKotlinBindings`), which
  # needs: bash + java (already present), the pinned wire-compiler and protoc
  # (idl/codegen/bootstrap_*.sh download and checksum-verify those itself), and
  # a Python with the protobuf runtime for RAConvenience.kt / RADefaultsPool.kt.
  #
  # bootstrap_pyproto.sh can build its own venv, but python3-venv is not
  # guaranteed on this image and a failure there would surface as an
  # unresolved-reference wall in Kotlin. Install the runtime directly, which
  # makes the bootstrap a no-op, and only warn if the image will not allow it.
  - python3 -m pip install --user --upgrade 'protobuf>=6.33,<7' pyyaml || echo "WARNING: pip install failed; idl/codegen/bootstrap_pyproto.sh will try a venv"
  - export ANDROID_HOME=$HOME/android-sdk
  - mkdir -p $ANDROID_HOME/cmdline-tools
  - wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O /tmp/cmdline-tools.zip
  - unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
  - mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
  - yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
  - $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" > /dev/null
  - echo "ANDROID_HOME=$HOME/android-sdk" >> $HOME/.bashrc

install:
  # Chain all commands so environment variables persist
  # Use publishToMavenLocal (not publishAllPublicationsToMavenLocal which doesn't exist)
  - export ANDROID_HOME=$HOME/android-sdk && export ANDROID_SDK_ROOT=$HOME/android-sdk && export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools && cd bindings/kotlin && ./gradlew downloadJniLibs -Prunanywhere.useLocalNatives=false --no-daemon && ./gradlew assembleRelease publishToMavenLocal -Prunanywhere.useLocalNatives=false --no-daemon --info 2>&1 | tail -300
