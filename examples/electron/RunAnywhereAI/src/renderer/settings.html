<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: file:; media-src 'self' data: blob:; connect-src 'self'"
    />
    <title>Settings</title>
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('ra.theme');
          const os = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          document.documentElement.dataset.theme = saved === 'light' || saved === 'dark' ? saved : os;
        } catch {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body class="ra-settings-body">
    <div id="settings-root" class="ra-settings"></div>
    <div id="toasts" class="ra-toast-host" aria-live="polite"></div>
    <script type="module" src="./settings.ts"></script>
  </body>
</html>
